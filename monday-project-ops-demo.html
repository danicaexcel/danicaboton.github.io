 tasks:{title:'[N] Master Tasks',tabs:['Main table','Kanban Board','My Tasks','Overdue Tasks','Revision Tasks','Tasks by Project','For Review','Task Calendar','Task Timeline'],columns:[['Item','item'],['Task ID','id'],['Connected Project','project'],['Responsible Person','person','person'],['Collaborators','collab'],['Task Status','status','pill'],['Priority','priority','pill'],['Start Date','start'],['Deadline','deadline'],['Timeline','timeline','timeline'],['Planned Hours','planned'],['Recorded Hours','recorded'],['Approved Hours','approved'],['Remaining Hours','remaining'],['Progress %','progress','percent'],['Revision Count','revisions'],['Rework Hours','rework'],['Rework Cost','reworkCost','money'],['Approval Required','approval','check'],['Task Type','type'],['Last Activity','last'],['Notes','notes']],rows:tasks},

const nav=[['dashboard','▥','[N] Project Operations Control Center'],['projects','▦','[N] Master Projects'],['tasks','▦','[N] Master Tasks'],['sessions','▦','[N] Work Sessions'],['revisions','▦','[N] Revisions & Rework'],['timesheets','▦','[N] Timesheets & Approvals'],['rates','▦','[N] Labor Rates'],['logs','▦','[N] Activity & Automation Logs']];
let state={key:'dashboard',query:''};
const navRoot=document.getElementById('nav'),screen=document.getElementById('screen');
function renderNav(){navRoot.innerHTML=nav.map(([k,i,l])=>`<button class="navitem ${state.key===k?'active':''}" data-key="${k}"><span class="navicon">${i}</span>${l}</button>`).join('');navRoot.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>{state.key=b.dataset.key;state.query='';render()})}
function value(row,col){const [label,key,type]=col;const v=row[key];if(type==='pill')return P(v);if(type==='person')return person(v);if(type==='money')return `<span class="money">${money(v)}</span>`;if(type==='timeline')return `${tl(v)} <small>${v}%</small>`;if(type==='percent')return `${v}%`;if(type==='check')return `<span class="checkbox">${v?'✓':'○'}</span>`;return v===''||v==null?'—':v}
function groupTone(name){if(/Overdue|Rejected|Errors/.test(name))return'red';if(/Planning|Closed/.test(name))return'amber';if(/Active Projects/.test(name))return'blue';if(/Completed|Resolved|Approved/.test(name))return'gray';return''}
function board(){const s=schemas[state.key];let rows=s.rows;if(state.query){const q=state.query.toLowerCase();rows=rows.filter(r=>Object.values(r).some(v=>String(v).toLowerCase().includes(q)))}const groups=[...new Set(s.rows.map(r=>r.group))];screen.innerHTML=`<div class="head"><div class="title-row"><h1>${s.title}⌄</h1><div class="actions"><span>⚒ Integrate</span><span>⚙ Automate</span><span>♧ Agents</span><span>◯</span><span>Invite / 1</span><b>•••</b></div></div><div class="tabs">${s.tabs.map((x,i)=>`<button class="tab ${i===0?'active':''}">${x}</button>`).join('')}<button class="tab">＋</button></div></div><div class="toolbar"><button class="newbtn">New item⌄</button><input class="tool-search" id="boardSearch" placeholder="⌕ Search" value="${state.query}"><button class="tool">◉ Person</button><button class="tool">▽ Filter</button><button class="tool">↕ Sort</button><button class="tool">◌ Hide</button><button class="tool">▣ Group by</button><button class="tool">•••</button><span class="board-count">${s.columns.length} columns · complete public reconstruction</span></div><div class="board-area">${groups.map(g=>{const gr=rows.filter(r=>r.group===g);if(!gr.length)return'';return`<section class="group" data-tone="${groupTone(g)}"><h2 class="group-title"><span>⌄</span><span class="dot"></span>${g}</h2><div class="table-scroll"><table class="board-table"><thead><tr>${s.columns.map(c=>`<th>${c[0]}</th>`).join('')}</tr></thead><tbody>${gr.map(r=>`<tr>${s.columns.map(c=>`<td title="${String(r[c[1]]??'').replace(/"/g,'&quot;')}">${value(r,c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></section>`}).join('')}<div class="footnote">Public reconstruction based on the implemented [N] Monday.com workspace. Names and operational values are synthetic; all backend schema columns are shown rather than truncated to the screenshot viewport.</div></div>`;document.getElementById('boardSearch').oninput=e=>{state.query=e.target.value;board()}}
function dashboard(){const activeProjects=projects.filter(p=>p.status==='Active'||p.status==='At Risk').length;const activeTasks=tasks.filter(t=>t.status!=='Completed').length;const reworkCost=revisions.reduce((a,b)=>a+Number(b.cost||0),0);const approvedLabor=timesheets.filter(t=>t.status==='Approved').reduce((a,b)=>a+Number(b.cost||0),0);const variance=projects.reduce((a,b)=>a+Math.min(0,Number(b.variance||0)),0);screen.innerHTML=`<div class="dashboard"><h1 class="dash-title">[N] Project Operations Control Center</h1><div class="kpis"><div class="card kpi"><small>ACTIVE PROJECTS</small><strong>${activeProjects}</strong></div><div class="card kpi"><small>ACTIVE TASKS</small><strong>${activeTasks}</strong></div><div class="card kpi"><small>REWORK COST</small><strong>${money(reworkCost)}</strong></div><div class="card kpi"><small>PROJECT BUDGET VARIANCE</small><strong>${money(variance)}</strong></div><div class="card kpi"><small>APPROVED LABOR COST</small><strong>${money(approvedLabor)}</strong></div></div><div class="dash-grid"><section class="card"><div class="panel-title">Planned vs Actual Hours</div><div class="chart">${[['Documentation',24,10],['Testing',32,30],['Design',60,56],['Development',80,62]].map(x=>`<div class="barrow"><span>${x[0]}</span><div class="bars"><i class="bar planned" style="width:${x[1]}%"></i><i class="bar actual" style="width:${x[2]}%"></i></div><b>${x[1]} / ${x[2]}</b></div>`).join('')}<div class="legend"><span>Planned Hours</span><span>Recorded Hours</span></div></div></section><section class="card"><div class="panel-title">Effort Quality — Rework & Utilization</div><div class="quality"><div class="quality-row"><span>Utilization</span><div class="meter"><i style="width:72%"></i></div><b>72%</b></div><div class="quality-row"><span>Rework rate</span><div class="meter"><i style="width:8%;background:#579bfc"></i></div><b>8%</b></div><div class="note">Actual hours derive from append-only work sessions. Revision and rework sessions remain separately identifiable so rework does not disappear inside an editable total.</div></div></section><section class="card"><div class="panel-title">Active Projects</div><table class="mini-table"><thead><tr><th>Project</th><th>Progress</th><th>Planned</th><th>Actual</th><th>Health</th></tr></thead><tbody>${projects.filter(p=>p.status==='Active'||p.status==='At Risk').map(p=>`<tr><td>${p.item}</td><td>${tl(p.progress)} ${p.progress}%</td><td>${p.planned}h</td><td>${p.actual}h</td><td>${P(p.health)}</td></tr>`).join('')}</tbody></table></section><section class="card"><div class="panel-title">Working Now</div><table class="mini-table"><thead><tr><th>Member</th><th>Task</th><th>Started</th></tr></thead><tbody>${sessions.filter(s=>s.status==='Active').map(s=>`<tr><td>${person(s.user)}</td><td>${s.task}</td><td>${s.start}</td></tr>`).join('')}</tbody></table><div class="workload">${[['Maria Santos',76],['Carlo Mendoza',88],['John Reyes',62],['Ana Cruz',71]].map(x=>`<div class="member"><div class="face">${x[0].split(' ').map(v=>v[0]).join('')}</div><b>${x[0]}</b><small>${x[1]}% planned capacity</small><div class="meter"><i style="width:${x[1]}%"></i></div></div>`).join('')}</div></section><section class="card"><div class="panel-title">Project Health</div><table class="mini-table"><thead><tr><th>Project</th><th>Status</th><th>Health</th><th>Deadline</th></tr></thead><tbody>${projects.map(p=>`<tr><td>${p.item}</td><td>${P(p.status)}</td><td>${P(p.health)}</td><td>${p.deadline}</td></tr>`).join('')}</tbody></table></section><section class="card"><div class="panel-title">Task Status</div><table class="mini-table"><thead><tr><th>Task</th><th>Project</th><th>Status</th><th>Deadline</th></tr></thead><tbody>${tasks.map(t=>`<tr><td>${t.item}</td><td>${t.project}</td><td>${P(t.status)}</td><td>${t.deadline}</td></tr>`).join('')}</tbody></table></section></div><div class="footnote">Interactive portfolio reconstruction of the completed Monday.com workspace. Public names and values are synthetic; the board structure and operating model mirror the implemented [N] system.</div></div>`}
function render(){renderNav();state.key==='dashboard'?dashboard():board()}
render();
</script>
