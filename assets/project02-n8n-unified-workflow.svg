<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860" role="img" aria-labelledby="title desc">
<title id="title">Project 02 unified n8n workflow</title>
<desc id="desc">One webhook routes Project 02 actions through ten business domains into a shared state and business rules engine, with a separate scheduled reconciliation path.</desc>
<style>
.bg{fill:#171717}.grid{stroke:#242424;stroke-width:1}.wire{fill:none;stroke:#666;stroke-width:2;opacity:.72}.node{fill:#252525;stroke:#555;stroke-width:1.2;rx:7}.router{fill:#1f2c35;stroke:#4d819a;stroke-width:1.4;rx:8}.trigger{fill:#252525;stroke:#636363;stroke-width:1.4;rx:8}.accent{fill:#f97316}.pink{fill:#ff4b78}.blue{fill:#5aa7d6}.label{font:700 13px Arial,sans-serif;fill:#fff}.small{font:11px Arial,sans-serif;fill:#a9b0b6}.tiny{font:10px Arial,sans-serif;fill:#8f979d}.head{font:700 22px Arial,sans-serif;fill:#fff}.sub{font:13px Arial,sans-serif;fill:#aeb5bb}.section{font:700 11px Arial,sans-serif;fill:#f5b36d;letter-spacing:.08em}
</style>
<rect class="bg" width="1600" height="860"/>
<g opacity=".45">
<path class="grid" d="M0 80H1600M0 160H1600M0 240H1600M0 320H1600M0 400H1600M0 480H1600M0 560H1600M0 640H1600M0 720H1600M0 800H1600"/>
<path class="grid" d="M80 0V860M160 0V860M240 0V860M320 0V860M400 0V860M480 0V860M560 0V860M640 0V860M720 0V860M800 0V860M880 0V860M960 0V860M1040 0V860M1120 0V860M1200 0V860M1280 0V860M1360 0V860M1440 0V860M1520 0V860"/>
</g>
<text x="70" y="58" class="section">DEPLOYED N8N IMPLEMENTATION</text>
<text x="70" y="90" class="head">Project 02 · Unified Operations Control Center</text>
<text x="70" y="116" class="sub">Single webhook ingress · true action router · ten business domains · shared state engine · scheduled reconciliation</text>

<!-- ingress -->
<path class="wire" d="M200 410H300M430 410H525"/>
<rect class="trigger" x="70" y="370" width="130" height="80"/>
<circle cx="94" cy="392" r="7" class="pink"/>
<text x="88" y="419" class="label">Project 02 Webhook</text><text x="88" y="438" class="tiny">Single public ingress</text>
<rect class="node" x="300" y="370" width="130" height="80"/>
<text x="319" y="405" class="label">Normalize Request</text><text x="319" y="425" class="tiny">action · client · payload</text>
<rect class="router" x="525" y="340" width="145" height="140"/>
<text x="553" y="397" class="label">02 · ACTION ROUTER</text><text x="550" y="417" class="tiny">10-output Switch</text>

<!-- branches -->
<g>
<path class="wire" d="M670 360C720 350 725 185 795 185M670 372C725 372 730 240 795 240M670 386C730 386 735 295 795 295M670 400C735 400 740 350 795 350M670 414C735 414 740 405 795 405M670 428C735 428 740 460 795 460M670 442C735 442 740 515 795 515M670 454C735 454 740 570 795 570M670 466C735 466 740 625 795 625M670 476C735 476 740 680 795 680"/>
</g>

<!-- domain nodes -->
<g>
<rect class="node" x="795" y="155" width="220" height="60"/><text x="814" y="180" class="label">00 · System / State Control</text><text x="814" y="199" class="tiny">health · state · reset · retry</text>
<rect class="node" x="795" y="210" width="220" height="60"/><text x="814" y="235" class="label">01 · Task Integrity & Project Sync</text><text x="814" y="254" class="tiny">validate task/project ownership</text>
<rect class="node" x="795" y="265" width="220" height="60"/><text x="814" y="290" class="label">02 · Work Session Lifecycle</text><text x="814" y="309" class="tiny">start · pause · resume · stop</text>
<rect class="node" x="1050" y="265" width="200" height="60"/><text x="1069" y="290" class="label">03 · Effort Rollup Engine</text><text x="1069" y="309" class="tiny">original · rework · remaining</text>
<rect class="node" x="795" y="320" width="220" height="60"/><text x="814" y="345" class="label">04 · Revision & Rework Control</text><text x="814" y="364" class="tiny">revision evidence · resolution</text>
<rect class="node" x="795" y="375" width="220" height="60"/><text x="814" y="400" class="label">05 · Escalation & Overdue Engine</text><text x="814" y="419" class="tiny">risk · overdue · escalation state</text>
<rect class="node" x="795" y="430" width="220" height="60"/><text x="814" y="455" class="label">06 · Timesheet Builder</text><text x="814" y="474" class="tiny">closed sessions → submission</text>
<rect class="node" x="795" y="485" width="220" height="60"/><text x="814" y="510" class="label">07 · Timesheet Approval Boundary</text><text x="814" y="529" class="tiny">approve · return · reject</text>
<rect class="node" x="795" y="540" width="220" height="60"/><text x="814" y="565" class="label">08 · Effective-Dated Rate Resolver</text><text x="814" y="584" class="tiny">historical rate by work date</text>
<rect class="router" x="1050" y="520" width="200" height="78"/><text x="1076" y="550" class="label">08B · RATE / COST ROUTER</text><text x="1082" y="570" class="tiny">lookup vs approved posting</text>
<rect class="node" x="1280" y="500" width="220" height="60"/><text x="1300" y="525" class="label">07B · Approved Work Ledger</text><text x="1300" y="544" class="tiny">locked approved cost evidence</text>
<rect class="node" x="795" y="595" width="220" height="60"/><text x="814" y="620" class="label">09 · KPI & Dashboard Recalculation</text><text x="814" y="639" class="tiny">hours · cost · budget · health</text>
<rect class="node" x="795" y="650" width="220" height="60"/><text x="814" y="675" class="label">10 · Reconciliation & Audit</text><text x="814" y="694" class="tiny">integrity checks · safe repair</text>
<rect class="router" x="1050" y="640" width="200" height="78"/><text x="1070" y="669" class="label">10A · SOURCE ROUTER</text><text x="1081" y="690" class="tiny">manual/API vs schedule</text>
</g>

<!-- additional branch connections -->
<path class="wire" d="M1015 295H1050M1015 350C1030 350 1030 295 1050 295M1015 515C1035 515 1035 559 1050 559M1250 540H1280"/>

<!-- shared engine -->
<g>
<path class="wire" d="M1015 185C1200 185 1190 392 1320 392M1015 240C1190 240 1190 392 1320 392M1250 295C1280 295 1280 392 1320 392M1015 405C1195 405 1195 392 1320 392M1015 460C1200 460 1200 392 1320 392M1015 625C1200 625 1200 392 1320 392M1250 679C1290 679 1290 392 1320 392M1500 530C1518 530 1518 392 1540 392"/>
<rect class="node" x="1320" y="350" width="220" height="85"/><text x="1343" y="382" class="label">Unified State + Business Rules</text><text x="1343" y="402" class="label">Engine</text><text x="1343" y="422" class="tiny">authoritative state · calculations · audit</text>
<rect class="trigger" x="1540" y="360" width="55" height="65"/><circle cx="1567" cy="382" r="7" class="pink"/><text x="1548" y="410" class="tiny">Respond</text>
</g>

<!-- scheduled path -->
<path class="wire" d="M200 770H340M500 770C635 770 650 690 795 690M1250 679C1300 679 1310 770 1360 770M1490 770H1540"/>
<rect class="trigger" x="70" y="730" width="130" height="78"/><circle cx="94" cy="752" r="7" class="accent"/><text x="88" y="777" class="label">15 Minute Reconciliation</text><text x="88" y="796" class="tiny">scheduled trigger</text>
<rect class="node" x="340" y="730" width="160" height="78"/><text x="361" y="758" class="label">Build Scheduled</text><text x="361" y="778" class="label">Request</text><text x="361" y="796" class="tiny">same request contract</text>
<rect class="node" x="1360" y="730" width="130" height="78"/><text x="1380" y="758" class="label">10B · Execute</text><text x="1380" y="778" class="label">Scheduled Recon</text><text x="1380" y="796" class="tiny">all demo clients</text>
<rect class="node" x="1540" y="730" width="55" height="78"/><text x="1548" y="758" class="tiny">Audit</text><text x="1548" y="776" class="tiny">Summary</text>
</svg>