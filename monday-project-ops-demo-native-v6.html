<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Monday.com Project Operations Control Center — DCode</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}#native{display:block;width:100%;height:100%;border:0;background:#fff}</style>
</head>
<body>
<iframe id="native" src="monday-project-ops-demo-native-v4.html?v=20260903-nativewidgets2" title="Interactive Monday.com Project Operations Control Center reconstruction" allowfullscreen></iframe>
<script>
(function(){
  const outer=document.getElementById('native');
  function baseDoc(){
    try{
      const d4=outer.contentDocument;if(!d4)return null;
      const summary=d4.getElementById('summary');if(!summary||!summary.contentDocument)return null;
      const d3=summary.contentDocument;
      const shell=d3.getElementById('shell');if(!shell||!shell.contentDocument)return null;
      const d2=shell.contentDocument;
      const demo=d2.getElementById('demo');if(!demo||!demo.contentDocument)return null;
      return demo.contentDocument;
    }catch(e){return null}
  }
  function widgetHead(title){return `<div class="monday-dw-head"><span>${title}</span><div class="monday-dw-tools"><span title="Filter">▽</span><span class="monday-dw-more">...</span></div></div>`}
  function install(){
    const doc=baseDoc();if(!doc||!doc.getElementById('screen'))return false;
    if(!doc.getElementById('monday-dashboard-native-v2-style')){
      const style=doc.createElement('style');
      style.id='monday-dashboard-native-v2-style';
      style.textContent=`
        .dashboard{background:#f6f7fb!important;padding:18px 16px 40px!important}
        .dashboard .card:not(.native-team-workload){border:1px solid #d0d4e4!important;border-radius:8px!important;background:#fff!important;box-shadow:none!important;overflow:hidden!important;padding:0!important}
        .monday-dw-head{height:40px;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 16px;border-bottom:1px solid #d0d4e4;background:#fff;color:#323338;font-size:13px;font-weight:500;letter-spacing:0}
        .monday-dw-tools{display:flex;align-items:center;gap:14px;color:#676879;font-size:14px;font-weight:400}.monday-dw-more{font-size:17px;line-height:1;letter-spacing:1px}
        .dashboard .kpi{min-height:116px!important}.dashboard .kpi small,.dashboard .kpi>strong{display:none!important}.monday-number-body{height:75px;display:grid;place-items:center;background:#fff}.monday-number-body strong{font-size:29px;font-weight:400;color:#323338}
        .dashboard .panel-title{display:none!important}
        .monday-chart-body{padding:14px 18px 16px;background:#fff}
        .monday-chart-axis{display:grid;grid-template-columns:100px 1fr 42px;align-items:end;gap:8px;margin-bottom:8px;color:#8a8f9e;font-size:9px}.monday-chart-axis .ticks{display:flex;justify-content:space-between;border-bottom:1px solid #e6e9ef;padding-bottom:4px}
        .monday-chart-row{display:grid;grid-template-columns:100px minmax(160px,1fr) 42px;align-items:center;gap:8px;margin:14px 0;color:#53576a;font-size:11px}
        .monday-chart-track{height:22px;background:#f1f3f6;border-left:1px solid #d0d4e4;position:relative;overflow:hidden}.monday-chart-track:before,.monday-chart-track:after{content:"";position:absolute;top:0;bottom:0;width:1px;background:#e3e5ec}.monday-chart-track:before{left:50%}.monday-chart-track:after{left:75%}
        .monday-chart-bar{display:block;height:100%;background:#579bfc}.monday-chart-bar.rework{background:#e2445c}.monday-chart-value{text-align:right;color:#323338;font-weight:600}.monday-chart-legend{display:flex;align-items:center;justify-content:center;gap:18px;color:#676879;font-size:10px;padding-top:4px}.monday-chart-legend span{display:flex;align-items:center;gap:6px}.monday-chart-legend i{width:9px;height:9px;border-radius:2px;background:#579bfc}.monday-chart-legend i.rework{background:#e2445c}
        .dashboard .mini-table{width:100%;border-collapse:collapse;background:#fff}.dashboard .mini-table th{background:#f8f9fb!important;color:#676879!important;font-weight:500}.dashboard .mini-table th,.dashboard .mini-table td{border-bottom:1px solid #e6e9f0!important;padding:10px 12px!important}
        .dashboard .chart{padding:14px 18px 16px!important;background:#fff!important}.dashboard .barrow{margin:14px 0!important}.dashboard .legend{padding-top:4px!important}
        .dashboard .workload{border-top:1px solid #eef0f4;background:#fff}
      `;
      doc.head.appendChild(style);
    }
    const dashboard=doc.querySelector('.dashboard');if(!dashboard)return false;

    dashboard.querySelectorAll('.kpi').forEach(card=>{
      if(card.dataset.nativeNumber2==='1')return;
      const label=card.querySelector('small')?.textContent.trim()||'NUMBER';
      const value=card.querySelector('strong')?.textContent.trim()||'—';
      card.dataset.nativeNumber2='1';
      card.insertAdjacentHTML('afterbegin',widgetHead(label));
      card.insertAdjacentHTML('beforeend',`<div class="monday-number-body"><strong>${value}</strong></div>`);
    });

    [...dashboard.querySelectorAll('.dash-grid > section.card:not(.native-team-workload)')].forEach(card=>{
      if(card.dataset.nativePanel2==='1')return;
      const old=card.querySelector('.panel-title');
      const title=old?.textContent.trim()||'Widget';
      card.dataset.nativePanel2='1';
      card.insertAdjacentHTML('afterbegin',widgetHead(title));
    });

    const quality=[...dashboard.querySelectorAll('.dash-grid > section.card')].find(card=>/Effort Quality/i.test(card.textContent));
    if(quality&&quality.dataset.nativeQualityChart!=='1'){
      quality.dataset.nativeQualityChart='1';
      const original=quality.querySelector('.quality');
      const vals=original?[...original.textContent.matchAll(/(\d+(?:\.\d+)?)%/g)].map(m=>Number(m[1])):[];
      const util=Number.isFinite(vals[0])?vals[0]:72;
      const rework=Number.isFinite(vals[1])?vals[1]:8;
      quality.innerHTML=widgetHead('Effort Quality — Utilization vs Rework')+`
        <div class="monday-chart-body">
          <div class="monday-chart-axis"><span></span><div class="ticks"><span>0</span><span>25</span><span>50</span><span>75</span><span>100%</span></div><span></span></div>
          <div class="monday-chart-row"><span>Utilization</span><div class="monday-chart-track"><i class="monday-chart-bar" style="width:${Math.max(0,Math.min(100,util))}%"></i></div><b class="monday-chart-value">${util}%</b></div>
          <div class="monday-chart-row"><span>Rework rate</span><div class="monday-chart-track"><i class="monday-chart-bar rework" style="width:${Math.max(0,Math.min(100,rework))}%"></i></div><b class="monday-chart-value">${rework}%</b></div>
          <div class="monday-chart-legend"><span><i></i>Utilization</span><span><i class="rework"></i>Rework rate</span></div>
        </div>`;
    }

    const planned=[...dashboard.querySelectorAll('.dash-grid > section.card')].find(card=>/Planned vs Actual Hours/i.test(card.textContent));
    if(planned&&!planned.dataset.nativeChart2){planned.dataset.nativeChart2='1';const h=planned.querySelector('.monday-dw-head');if(h)h.querySelector('span').textContent='Planned vs Actual Hours';}
    return true;
  }
  function start(){
    let tries=0;
    const timer=setInterval(()=>{tries++;install();if(tries>160)clearInterval(timer)},100);
    const watcher=setInterval(()=>{
      const doc=baseDoc();const screen=doc&&doc.getElementById('screen');
      if(screen&&!screen.dataset.nativeDashboardV2Observed){screen.dataset.nativeDashboardV2Observed='1';new MutationObserver(()=>requestAnimationFrame(install)).observe(screen,{childList:true,subtree:true});clearInterval(watcher)}
    },150);
    setTimeout(()=>clearInterval(watcher),20000);
  }
  outer.addEventListener('load',start);start();
})();
</script>
</body>
</html>
