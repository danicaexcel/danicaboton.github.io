<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Monday.com Project Operations Control Center — DCode</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}#summary{display:block;width:100%;height:100%;border:0;background:#fff}</style>
</head>
<body>
<iframe id="summary" src="monday-project-ops-demo-native-v3.html?v=20260903-workload4" title="Interactive Monday.com Project Operations Control Center reconstruction" allowfullscreen></iframe>
<script>
(function(){
  const outer=document.getElementById('summary');
  const days=[
    ['Su','28','weekend',0],['Mo','29','',69],['Tu','30','',69],['We','1','',69],['Th','2','',69],['Fr','3','',51],['Sa','4','weekend',0],['Su','5','weekend',0],['Mo','6','',50],['Tu','7','',58],['We','8','',58],['Th','9','',58],['Fr','10','',58],['Sa','11','weekend',0],['Su','12','weekend',0]
  ];
  function baseDoc(){
    try{
      const d3=outer.contentDocument;if(!d3)return null;
      const shell=d3.getElementById('shell');if(!shell||!shell.contentDocument)return null;
      const d2=shell.contentDocument;
      const demo=d2.getElementById('demo');if(!demo||!demo.contentDocument)return null;
      return demo.contentDocument;
    }catch(e){return null}
  }
  function bubble(p){
    if(!p)return '';
    const inner=Math.max(18,Math.round(18+(p-45)*.55));
    return `<span class="current-wl-bubble"><i style="width:${inner}px;height:${inner}px"></i></span><span class="current-wl-pct">${p}%</span>`;
  }
  function install(){
    const doc=baseDoc();if(!doc)return false;
    const widget=doc.querySelector('.native-team-workload');
    if(!widget)return false;
    if(widget.dataset.currentMondayWorkload==='1')return true;
    if(!doc.getElementById('current-monday-workload-style')){
      const style=doc.createElement('style');
      style.id='current-monday-workload-style';
      style.textContent=`
        .native-team-workload.current-monday-workload{grid-column:1/-1!important;min-height:520px!important;border:1px solid #d0d4e4!important;border-radius:8px!important;overflow:hidden!important;background:#fff!important;box-shadow:none!important}
        .current-wl-titlebar{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid #d0d4e4;background:#fff}.current-wl-titlebar strong{font-size:20px;font-weight:500;color:#323338}.current-wl-close{border:0;background:transparent;color:#323338;font-size:22px;line-height:1;padding:4px 8px;cursor:default}
        .current-wl-tools{height:40px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid #d0d4e4;background:#fff;color:#323338;font-size:12px}.current-wl-tools-left,.current-wl-tools-right{display:flex;align-items:center;gap:9px}.current-wl-filterbox{width:146px;height:26px;border:1px solid #bfc4d4;border-radius:3px;padding:0 10px;color:#676879;background:#fff}.current-wl-iconbtn{height:28px;border:0;background:transparent;color:#53576a;padding:0 7px;font-size:12px;display:inline-flex;align-items:center;gap:5px}.current-wl-outline{height:28px;border:1px solid #c3c7d5;background:#fff;border-radius:3px;padding:0 10px;color:#53576a}.current-wl-select{min-width:78px;display:inline-flex;align-items:center;justify-content:space-between;gap:13px}.current-wl-more{font-size:18px;letter-spacing:2px}
        .current-wl-scroll{overflow-x:auto;overflow-y:hidden;scrollbar-width:none!important;-ms-overflow-style:none!important;background:#fff}.current-wl-scroll::-webkit-scrollbar{width:0!important;height:0!important;display:none!important}.current-wl-grid{min-width:1580px;position:relative;background:#fff}.current-wl-weekrow{display:grid;grid-template-columns:200px repeat(15,92px);height:51px;border-bottom:1px solid #d0d4e4}.current-wl-weekside{grid-row:1;grid-column:1;border-right:1px solid #d0d4e4;position:relative}.current-wl-pin{position:absolute;left:14px;top:19px;width:15px;height:15px;border-radius:4px;background:#c8ccd5;color:#fff;display:grid;place-items:center;font-size:9px}.current-wl-prev{position:absolute;right:7px;top:13px;width:24px;height:24px;border-radius:50%;border:1px solid #d0d4e4;background:#fff;color:#676879;font-size:17px}.current-wl-weeklabel{display:flex;align-items:center;justify-content:center;color:#323338;font-size:11px;border-right:1px solid #e0e3ea}.current-wl-weeklabel.w27{grid-column:3/10}.current-wl-weeklabel.w28{grid-column:10/17}.current-wl-datehead{display:grid;grid-template-columns:200px repeat(15,92px);height:31px;border-bottom:1px solid #d0d4e4}.current-wl-datehead>div{height:31px;border-right:1px solid #d0d4e4;display:flex;align-items:center;justify-content:center;color:#53576a;font-size:9px}.current-wl-datehead>div:first-child{background:#fff}.current-wl-row{display:grid;grid-template-columns:200px repeat(15,92px);height:64px;border-bottom:1px solid #d0d4e4}.current-wl-person{border-right:1px solid #d0d4e4;display:flex;align-items:center;padding:0 33px;gap:9px;color:#323338;font-size:12px;background:#fff}.current-wl-avatar{width:24px;height:24px;border-radius:50%;background:#bfe1f7;color:#fff;display:grid;place-items:center;font-size:9px;font-weight:700}.current-wl-cell{position:relative;border-right:1px solid #d0d4e4;display:flex;align-items:flex-start;justify-content:center;padding-top:7px;background:#fff}.current-wl-cell.weekend{background:repeating-linear-gradient(135deg,#fff 0,#fff 3px,#eef0f5 3px,#eef0f5 5px)}.current-wl-bubble{width:44px;height:44px;border-radius:50%;background:#c4e3ff;display:grid;place-items:center}.current-wl-bubble i{display:block;border-radius:50%;background:#0073ea}.current-wl-pct{position:absolute;right:4px;bottom:3px;color:#676879;font-size:9px}
        .current-wl-blank{display:grid;grid-template-columns:200px repeat(15,92px);height:330px}.current-wl-blank>div{border-right:1px solid #e0e3ea;background:#fff}.current-wl-blank>div:first-child{box-shadow:2px 0 6px rgba(50,51,56,.08);z-index:1}.current-wl-footer{height:42px;border-top:1px solid #f0f1f5;background:#fff;display:flex;align-items:center;justify-content:center;position:relative}.current-wl-thumb{position:absolute;top:-9px;left:29%;width:80px;height:8px;border-radius:7px;background:#5c5f73}.current-wl-legend{display:flex;align-items:center;gap:24px;color:#53576a;font-size:11px}.current-wl-legend span{display:flex;align-items:center;gap:7px}.current-wl-legend i{width:10px;height:10px;border-radius:50%;display:block}.current-wl-legend .blocked{background:#e2445c}.current-wl-legend .completed{background:#00c875}.current-wl-legend .working{background:#fdab3d}
        @media(max-width:720px){.native-team-workload.current-monday-workload{min-height:430px!important}.current-wl-titlebar strong{font-size:16px}.current-wl-tools{padding:0 8px}.current-wl-filterbox{width:112px}.current-wl-iconbtn.people,.current-wl-iconbtn.filter{display:none}.current-wl-blank{height:250px}}
      `;
      doc.head.appendChild(style);
    }
    widget.classList.add('current-monday-workload');
    widget.dataset.currentMondayWorkload='1';
    widget.innerHTML=`
      <div class="current-wl-titlebar"><strong>Team Workload</strong><button class="current-wl-close" aria-label="Close">×</button></div>
      <div class="current-wl-tools">
        <div class="current-wl-tools-left"><input class="current-wl-filterbox" placeholder="⌕  Type to filter"><button class="current-wl-iconbtn" title="Save">▣</button><button class="current-wl-iconbtn people">◎ People</button><button class="current-wl-iconbtn filter">▽ Filter</button></div>
        <div class="current-wl-tools-right"><button class="current-wl-outline">Today</button><button class="current-wl-outline current-wl-select"><span>Days</span><span>⌄</span></button><button class="current-wl-iconbtn" title="Settings">⚙</button><button class="current-wl-iconbtn current-wl-more">...</button></div>
      </div>
      <div class="current-wl-scroll"><div class="current-wl-grid">
        <div class="current-wl-weekrow"><div class="current-wl-weekside"><span class="current-wl-pin">↕</span><button class="current-wl-prev">‹</button></div><div class="current-wl-weeklabel w27">Week 27 Jun 29 - Jul 5</div><div class="current-wl-weeklabel w28">Week 28 Jul 6 - Jul 12</div></div>
        <div class="current-wl-datehead"><div></div>${days.map(d=>`<div>${d[0]} ${d[1]}</div>`).join('')}</div>
        <div class="current-wl-row"><div class="current-wl-person"><span class="current-wl-avatar">DB</span><span>Danica Boton</span></div>${days.map(d=>`<div class="current-wl-cell ${d[2]}">${bubble(d[3])}</div>`).join('')}</div>
        <div class="current-wl-blank"><div></div>${days.map(()=>'<div></div>').join('')}</div>
        <div class="current-wl-footer"><span class="current-wl-thumb"></span><div class="current-wl-legend"><span><i class="blocked"></i>Blocked</span><span><i class="completed"></i>Completed</span><span><i class="working"></i>Working on it</span></div></div>
      </div></div>`;
    return true;
  }
  function wire(){
    let attempts=0;
    const timer=setInterval(()=>{attempts++;if(install()||attempts>80)clearInterval(timer)},100);
  }
  outer.addEventListener('load',wire);
  wire();
})();
</script>
</body>
</html>
