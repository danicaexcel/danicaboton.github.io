<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Monday.com Project Operations Control Center — DCode</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}#summary{display:block;width:100%;height:100%;border:0;background:#fff}</style>
</head>
<body>
<iframe id="summary" src="monday-project-ops-demo-native-v3.html?v=20260903-workload5" title="Interactive Monday.com Project Operations Control Center reconstruction" allowfullscreen></iframe>
<script>
(function(){
  const outer=document.getElementById('summary');
  const members=[
    {name:'Maria Santos',initials:'MS',days:[69,74,82,76,65,51,0,0,58,63,71,66,55,0,0],weeks:[62,74,81,68,57,71],months:[58,66,73,69,61,64]},
    {name:'Carlo Mendoza',initials:'CM',days:[0,58,63,71,76,82,0,0,69,72,77,81,66,0,0],weeks:[55,64,73,79,68,60],months:[63,70,68,76,72,65]},
    {name:'John Reyes',initials:'JR',days:[0,46,55,61,58,49,0,0,52,57,62,68,59,0,0],weeks:[48,56,61,66,59,52],months:[51,57,62,60,56,53]},
    {name:'Ana Cruz',initials:'AC',days:[0,52,64,70,67,60,0,0,61,65,72,74,63,0,0],weeks:[51,63,70,72,65,58],months:[55,62,69,71,64,59]}
  ];
  const dayColumns=[
    {label:'Su 28',weekend:true},{label:'Mo 29'},{label:'Tu 30'},{label:'We 1'},{label:'Th 2'},{label:'Fr 3'},{label:'Sa 4',weekend:true},{label:'Su 5',weekend:true},{label:'Mo 6'},{label:'Tu 7'},{label:'We 8'},{label:'Th 9'},{label:'Fr 10'},{label:'Sa 11',weekend:true},{label:'Su 12',weekend:true}
  ];
  const weekColumns=[
    {label:'W25 Jun 15 - 21'},{label:'W26 Jun 22 - 28'},{label:'W27 Jun 29 - Jul 5'},{label:'W28 Jul 6 - 12'},{label:'W29 Jul 13 - 19'},{label:'W30 Jul 20 - 26'}
  ];
  const monthColumns=[
    {label:'May 2026'},{label:'June 2026'},{label:'July 2026'},{label:'August 2026'},{label:'September 2026'},{label:'October 2026'}
  ];
  let mode='Day';

  function baseDoc(){
    try{
      const d3=outer.contentDocument;if(!d3)return null;
      const shell=d3.getElementById('shell');if(!shell||!shell.contentDocument)return null;
      const d2=shell.contentDocument;
      const demo=d2.getElementById('demo');if(!demo||!demo.contentDocument)return null;
      return demo.contentDocument;
    }catch(e){return null}
  }
  function bubble(p){
    if(!p)return '';
    const inner=Math.max(14,Math.min(36,Math.round(14+(p-40)*.55)));
    return `<span class="current-wl-bubble"><i style="width:${inner}px;height:${inner}px"></i></span><span class="current-wl-pct">${p}%</span>`;
  }
  function config(){
    if(mode==='Week')return {columns:weekColumns,key:'weeks',width:172,period:'June — July 2026',groups:[]};
    if(mode==='Month')return {columns:monthColumns,key:'months',width:188,period:'May — October 2026',groups:[]};
    return {columns:dayColumns,key:'days',width:92,period:'',groups:[{label:'Week 27 Jun 29 - Jul 5',start:2,end:9},{label:'Week 28 Jul 6 - Jul 12',start:9,end:17}]};
  }
  function rowMarkup(member,cfg){
    return `<div class="current-wl-row" style="--cols:${cfg.columns.length};--cell:${cfg.width}px"><div class="current-wl-person"><span class="current-wl-avatar">${member.initials}</span><span>${member.name}</span></div>${cfg.columns.map((c,i)=>`<div class="current-wl-cell ${c.weekend?'weekend':''}">${bubble(member[cfg.key][i]||0)}</div>`).join('')}</div>`;
  }
  function viewMarkup(){
    const cfg=config();
    const groupRow=mode==='Day'
      ? `<div class="current-wl-weekrow" style="--cols:${cfg.columns.length};--cell:${cfg.width}px"><div class="current-wl-weekside"><span class="current-wl-pin">↕</span><button class="current-wl-prev" aria-label="Previous">‹</button></div>${cfg.groups.map(g=>`<div class="current-wl-weeklabel" style="grid-column:${g.start}/${g.end}">${g.label}</div>`).join('')}</div>`
      : `<div class="current-wl-periodrow" style="--cols:${cfg.columns.length};--cell:${cfg.width}px"><div class="current-wl-weekside"><span class="current-wl-pin">↕</span><button class="current-wl-prev" aria-label="Previous">‹</button></div><div class="current-wl-periodlabel" style="grid-column:2/${cfg.columns.length+2}">${cfg.period}</div></div>`;
    return `${groupRow}<div class="current-wl-datehead" style="--cols:${cfg.columns.length};--cell:${cfg.width}px"><div></div>${cfg.columns.map(c=>`<div>${c.label}</div>`).join('')}</div><div class="current-wl-memberrows">${members.map(m=>rowMarkup(m,cfg)).join('')}</div><div class="current-wl-blank" style="--cols:${cfg.columns.length};--cell:${cfg.width}px"><div></div>${cfg.columns.map(()=>'<div></div>').join('')}</div>`;
  }
  function install(){
    const doc=baseDoc();if(!doc)return false;
    const widget=doc.querySelector('.native-team-workload');
    if(!widget)return false;
    if(widget.dataset.currentMondayWorkload==='2')return true;
    if(!doc.getElementById('current-monday-workload-style')){
      const style=doc.createElement('style');
      style.id='current-monday-workload-style';
      style.textContent=`
        .native-team-workload.current-monday-workload{grid-column:1/-1!important;min-height:540px!important;border:1px solid #d0d4e4!important;border-radius:8px!important;overflow:hidden!important;background:#fff!important;box-shadow:none!important}
        .current-wl-titlebar{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid #d0d4e4;background:#fff}.current-wl-titlebar strong{font-size:20px;font-weight:500;color:#323338}.current-wl-close{border:0;background:transparent;color:#323338;font-size:22px;line-height:1;padding:4px 8px;cursor:default}
        .current-wl-tools{height:40px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid #d0d4e4;background:#fff;color:#323338;font-size:12px}.current-wl-tools-left,.current-wl-tools-right{display:flex;align-items:center;gap:9px}.current-wl-filterbox{width:146px;height:26px;border:1px solid #bfc4d4;border-radius:3px;padding:0 10px;color:#676879;background:#fff}.current-wl-iconbtn{height:28px;border:0;background:transparent;color:#53576a;padding:0 7px;font-size:12px;display:inline-flex;align-items:center;gap:5px}.current-wl-outline{height:28px;border:1px solid #c3c7d5;background:#fff;border-radius:3px;padding:0 10px;color:#53576a}.current-wl-select-wrap{position:relative}.current-wl-select{min-width:84px;display:inline-flex;align-items:center;justify-content:space-between;gap:13px}.current-wl-menu{position:absolute;right:0;top:31px;z-index:30;min-width:112px;padding:5px;background:#fff;border:1px solid #d0d4e4;border-radius:5px;box-shadow:0 5px 18px rgba(50,51,56,.18);display:none}.current-wl-menu.open{display:block}.current-wl-menu button{width:100%;height:30px;border:0;background:#fff;text-align:left;padding:0 9px;border-radius:4px;color:#323338;font-size:12px}.current-wl-menu button:hover,.current-wl-menu button.active{background:#e6f4ff;color:#0073ea}.current-wl-more{font-size:18px;letter-spacing:2px}
        .current-wl-scroll{overflow-x:auto;overflow-y:hidden;scrollbar-width:none!important;-ms-overflow-style:none!important;background:#fff}.current-wl-scroll::-webkit-scrollbar{width:0!important;height:0!important;display:none!important}.current-wl-grid{position:relative;background:#fff;width:max-content;min-width:100%}.current-wl-weekrow,.current-wl-periodrow{display:grid;grid-template-columns:200px repeat(var(--cols),var(--cell));height:51px;border-bottom:1px solid #d0d4e4}.current-wl-weekside{grid-row:1;grid-column:1;border-right:1px solid #d0d4e4;position:relative}.current-wl-pin{position:absolute;left:14px;top:19px;width:15px;height:15px;border-radius:4px;background:#c8ccd5;color:#fff;display:grid;place-items:center;font-size:9px}.current-wl-prev{position:absolute;right:7px;top:13px;width:24px;height:24px;border-radius:50%;border:1px solid #d0d4e4;background:#fff;color:#676879;font-size:17px}.current-wl-weeklabel,.current-wl-periodlabel{display:flex;align-items:center;justify-content:center;color:#323338;font-size:11px;border-right:1px solid #e0e3ea}.current-wl-periodlabel{font-size:12px}
        .current-wl-datehead{display:grid;grid-template-columns:200px repeat(var(--cols),var(--cell));height:31px;border-bottom:1px solid #d0d4e4}.current-wl-datehead>div{height:31px;border-right:1px solid #d0d4e4;display:flex;align-items:center;justify-content:center;color:#53576a;font-size:9px;white-space:nowrap}.current-wl-datehead>div:first-child{background:#fff}
        .current-wl-row{display:grid;grid-template-columns:200px repeat(var(--cols),var(--cell));height:64px;border-bottom:1px solid #d0d4e4}.current-wl-person{border-right:1px solid #d0d4e4;display:flex;align-items:center;padding:0 22px;gap:9px;color:#323338;font-size:12px;background:#fff;position:sticky;left:0;z-index:4}.current-wl-avatar{width:24px;height:24px;border-radius:50%;background:#bfe1f7;color:#fff;display:grid;place-items:center;font-size:9px;font-weight:700}.current-wl-cell{position:relative;border-right:1px solid #d0d4e4;display:flex;align-items:flex-start;justify-content:center;padding-top:7px;background:#fff}.current-wl-cell.weekend{background:repeating-linear-gradient(135deg,#fff 0,#fff 3px,#eef0f5 3px,#eef0f5 5px)}.current-wl-bubble{width:44px;height:44px;border-radius:50%;background:#c4e3ff;display:grid;place-items:center}.current-wl-bubble i{display:block;border-radius:50%;background:#0073ea}.current-wl-pct{position:absolute;right:4px;bottom:3px;color:#676879;font-size:9px}
        .current-wl-blank{display:grid;grid-template-columns:200px repeat(var(--cols),var(--cell));height:225px}.current-wl-blank>div{border-right:1px solid #e0e3ea;background:#fff}.current-wl-blank>div:first-child{box-shadow:2px 0 6px rgba(50,51,56,.08);z-index:1;position:sticky;left:0}.current-wl-footer{height:42px;border-top:1px solid #f0f1f5;background:#fff;display:flex;align-items:center;justify-content:center;position:relative}.current-wl-thumb{position:absolute;top:-9px;left:29%;width:80px;height:8px;border-radius:7px;background:#5c5f73}.current-wl-legend{display:flex;align-items:center;gap:24px;color:#53576a;font-size:11px}.current-wl-legend span{display:flex;align-items:center;gap:7px}.current-wl-legend i{width:10px;height:10px;border-radius:50%;display:block}.current-wl-legend .blocked{background:#e2445c}.current-wl-legend .completed{background:#00c875}.current-wl-legend .working{background:#fdab3d}
        .current-wl-memberrows.filtered .current-wl-row{display:none}.current-wl-row.hidden{display:none}
        @media(max-width:720px){.native-team-workload.current-monday-workload{min-height:430px!important}.current-wl-titlebar strong{font-size:16px}.current-wl-tools{padding:0 8px}.current-wl-filterbox{width:112px}.current-wl-iconbtn.people,.current-wl-iconbtn.filter{display:none}.current-wl-blank{height:180px}}
      `;
      doc.head.appendChild(style);
    }
    widget.classList.add('current-monday-workload');
    widget.dataset.currentMondayWorkload='2';
    widget.innerHTML=`
      <div class="current-wl-titlebar"><strong>Team Workload</strong><button class="current-wl-close" aria-label="Close">×</button></div>
      <div class="current-wl-tools">
        <div class="current-wl-tools-left"><input class="current-wl-filterbox" placeholder="⌕  Type to filter"><button class="current-wl-iconbtn" title="Save">▣</button><button class="current-wl-iconbtn people">◎ People</button><button class="current-wl-iconbtn filter">▽ Filter</button></div>
        <div class="current-wl-tools-right"><button class="current-wl-outline current-wl-today">Today</button><div class="current-wl-select-wrap"><button class="current-wl-outline current-wl-select"><span class="current-wl-mode-label">Day</span><span>⌄</span></button><div class="current-wl-menu"><button data-mode="Day" class="active">Day</button><button data-mode="Week">Week</button><button data-mode="Month">Month</button></div></div><button class="current-wl-iconbtn" title="Settings">⚙</button><button class="current-wl-iconbtn current-wl-more">...</button></div>
      </div>
      <div class="current-wl-scroll"><div class="current-wl-grid"><div class="current-wl-view"></div><div class="current-wl-footer"><span class="current-wl-thumb"></span><div class="current-wl-legend"><span><i class="blocked"></i>Blocked</span><span><i class="completed"></i>Completed</span><span><i class="working"></i>Working on it</span></div></div></div></div>`;

    const view=widget.querySelector('.current-wl-view');
    const scroller=widget.querySelector('.current-wl-scroll');
    const label=widget.querySelector('.current-wl-mode-label');
    const menu=widget.querySelector('.current-wl-menu');
    const filter=widget.querySelector('.current-wl-filterbox');
    function renderView(){
      view.innerHTML=viewMarkup();
      label.textContent=mode;
      menu.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));
      scroller.scrollLeft=0;
      applyFilter();
    }
    function applyFilter(){
      const q=(filter.value||'').trim().toLowerCase();
      view.querySelectorAll('.current-wl-row').forEach(r=>{
        const name=(r.querySelector('.current-wl-person')?.textContent||'').toLowerCase();
        r.classList.toggle('hidden',!!q&&!name.includes(q));
      });
    }
    widget.querySelector('.current-wl-select').onclick=e=>{e.stopPropagation();menu.classList.toggle('open')};
    menu.querySelectorAll('[data-mode]').forEach(b=>b.onclick=e=>{e.stopPropagation();mode=b.dataset.mode;menu.classList.remove('open');renderView()});
    widget.querySelector('.current-wl-today').onclick=()=>{scroller.scrollLeft=0};
    filter.oninput=applyFilter;
    doc.addEventListener('click',()=>menu.classList.remove('open'),{once:false});
    renderView();
    return true;
  }
  function wire(){
    let attempts=0;
    const timer=setInterval(()=>{attempts++;if(install()||attempts>80)clearInterval(timer)},100);
  }
  outer.addEventListener('load',wire);
  wire();
})();
</script>
</body>
</html>
