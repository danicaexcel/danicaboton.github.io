function head(kicker,title,desc,actions=''){return `<div class="page-head"><div><small>${kicker}</small><h1>${title}</h1><p>${desc}</p></div><div class="actions">${actions}</div></div>`}
function overview(){const rows=projectRows.slice(0,4).map(p=>`<tr><td class="name"><b>${p.name}</b><span>${p.id}</span></td><td><div class="progress"><i style="width:${p.progress}%"></i></div><span>${p.progress}%</span></td><td>${p.planned} h</td><td>${p.actual} h</td><td>${p.variance>0?'+':''}${p.variance} h</td><td>${pill(p.health)}</td></tr>`).join('');const working=[['MS','Maria Santos','TASK-0241 · Approval workflow'],['CM','Carlo Mendoza','TASK-0244 · Time rules'],['JR','John Reyes','TASK-0242 · API auth'],['AC','Ana Cruz','TASK-0243 · Member workspace']];document.getElementById('content').innerHTML=head('Portfolio overview','Project Operations Dashboard','Project health, live work sessions, utilization, rework, and labor visibility from the same operational records.')+`<div class="kpis"><div class="kpi good"><span>Active Projects</span><strong>6</strong><small>4 on track</small></div><div class="kpi good"><span>Projects On Track</span><strong>4</strong><small>portfolio health</small></div><div class="kpi warn"><span>Projects At Risk</span><strong>1</strong><small>requires attention</small></div><div class="kpi bad"><span>Delayed Projects</span><strong>1</strong><small>schedule exception</small></div><div class="kpi"><span>Active Tasks</span><strong>37</strong><small>across 6 projects</small></div><div class="kpi"><span>Members Working Now</span><strong>8</strong><small>active sessions</small></div><div class="kpi"><span>Planned Hours</span><strong>1,280</strong><small>hours</small></div><div class="kpi"><span>Actual Hours</span><strong>1,147</strong><small>session-derived</small></div><div class="kpi good"><span>Labor Utilization</span><strong>89.6%</strong><small>approved + active work</small></div><div class="kpi warn"><span>Rework</span><strong>73 h</strong><small>5.3% rework rate</small></div></div><div class="grid2"><section class="panel"><div class="panel-head"><div><h3>Active Projects</h3><p>Planned versus actual effort and current health.</p></div></div><div class="table-wrap"><table class="table"><thead><tr><th>Project</th><th>Progress</th><th>Planned</th><th>Actual</th><th>Variance</th><th>Health</th></tr></thead><tbody>${rows}</tbody></table></div></section><section class="panel"><div class="panel-head"><div><h3>Working Now</h3><p>Members with active work sessions.</p></div><span class="pill good">8 active</span></div><div class="working">${working.map(w=>`<div class="working-row"><div class="avatar">${w[0]}</div><div><b>${w[1]}</b><span>${w[2]}</span></div>${pill('Working')}</div>`).join('')}</div></section></div><div class="grid2"><section class="panel"><div class="panel-head"><div><h3>Planned vs actual hours</h3><p>Orion phase effort.</p></div></div><div class="mini-bars">${[['Discovery',48,44],['Development',180,197],['Testing',92,88],['Deployment',45,39],['Documentation',55,50]].map(r=>`<div class="bar-row"><label>${r[0]}</label><div><div class="bar"><i style="width:${Math.min(100,r[1]/200*100)}%"></i></div><div class="bar actual" style="margin-top:3px"><i style="width:${Math.min(100,r[2]/200*100)}%"></i></div></div><b>${r[1]} / ${r[2]}h</b></div>`).join('')}</div></section><section class="panel"><div class="panel-head"><div><h3>Effort quality</h3><p>Utilization and rework indicators.</p></div></div><div class="panel-body"><div class="bar-row"><label>Utilization</label><div class="bar"><i style="width:89.6%"></i></div><b>89.6%</b></div><div class="bar-row"><label>Rework rate</label><div class="bar actual"><i style="width:26.5%"></i></div><b>5.3%</b></div><div class="audit-note">Actual hours are calculated from append-only work sessions. Revision sessions remain separately identifiable so rework does not disappear inside an editable total.</div></div></section></div>`}
function projectsView(){document.getElementById('content').innerHTML=head('Project portfolio','Projects','Active projects with team size, planned hours, actual hours, completion, and health.')+`<div class="project-cards">${projectRows.map(p=>`<article class="project-card"><header><small>${p.id}</small>${pill(p.health)}</header><h3>${p.name}</h3><p>${p.client} · ${p.team} team members</p><div class="progress"><i style="width:${p.progress}%"></i></div><div class="project-meta"><div><span>Completion</span><b>${p.progress}%</b></div><div><span>Planned</span><b>${p.planned} h</b></div><div><span>Actual</span><b>${p.actual} h</b></div></div></article>`).join('')}</div>`}
function taskBoard(){const cols=['Backlog','Ready','In Progress','Review','Done'];document.getElementById('content').innerHTML=head('Execution control','Task Board','Click a task to open its member execution workspace.')+`<div class="kanban">${cols.map(col=>`<section class="kanban-col"><div class="kanban-head"><span>${col}</span><span>${tasks.filter(t=>t.status===col).length}</span></div>${tasks.filter(t=>t.status===col).map(t=>`<article class="task-card" data-open-task="${t.id}"><header><small>${t.id}</small>${pill(t.priority)}</header><h4>${t.name}</h4><div class="task-meta"><div><span>Assigned</span><b>${t.member}</b></div><div><span>Due</span><b>${t.due}</b></div><div><span>Planned</span><b>${t.planned} h</b></div><div><span>Actual</span><b>${(t.recorded/3600).toFixed(2)} h</b></div></div><div class="task-foot"><span class="pill blue">${t.phase}</span><button data-quick-start="${t.id}">Start</button></div></article>`).join('')}</section>`).join('')}</div>`;document.querySelectorAll('[data-open-task]').forEach(c=>c.onclick=e=>{if(e.target.closest('[data-quick-start]'))return;selectedTask=c.dataset.openTask;view='My Workspace';nav();render()});document.querySelectorAll('[data-quick-start]').forEach(b=>b.onclick=e=>{e.stopPropagation();attemptStart(b.dataset.quickStart)})}
function timeline(){const phases=[['Discovery',2,2,''],['Architecture',4,2,'alt'],['Development',5,5,''],['Integration',8,3,'alt'],['Testing & QA',10,3,'warn'],['Deployment',13,1,'']];document.getElementById('content').innerHTML=head('Orion Operations Automation','Timeline','August 3, 2026 – October 30, 2026 · planned phase sequence and milestone visibility.')+`<section class="panel"><div class="panel-head"><div><h3>Gantt Timeline</h3><p>August · September · October 2026</p></div><span class="pill blue">Current date · Sep 3</span></div><div class="table-wrap"><div class="timeline"><div class="months"><b>Phase</b>${['Aug 3','Aug 10','Aug 17','Aug 24','Aug 31','Sep 7','Sep 14','Sep 21','Sep 28','Oct 5','Oct 12','Oct 19','Oct 26'].map(x=>`<span>${x}</span>`).join('')}</div><div class="today-line"></div>${phases.map(r=>`<div class="phase-row"><strong>${r[0]}</strong>${Array.from({length:13},()=>'<span class="cell"></span>').join('')}<i class="gbar ${r[3]}" style="grid-column:${r[1]}/span ${r[2]};grid-row:1"></i></div>`).join('')}</div></div></section><div class="audit-note">Dependencies are represented by phase order in this reconstruction. Milestone transitions are recorded through task, review, and approval events rather than by directly editing actual hours.</div>`}
function currentTask(){return tasks.find(t=>t.id===selectedTask)||tasks[0]}
function recordedNow(t){return t.recorded+(activeTask===t.id?sessionElapsed:0)}
function workspace(){const t=currentTask(),rec=recordedNow(t),remaining=Math.max(0,t.planned*3600-rec),sessions=timeLogs.filter(l=>l.task===t.id).slice(0,5);document.getElementById('content').innerHTML=head('Member workspace','My Workspace','Maria Santos · Automation Developer',`<button class="btn" data-other="TASK-0242">Try second task</button>`)+`<div class="kpis"><div class="kpi"><span>Working Today</span><strong>5h 47m</strong><small>session total</small></div><div class="kpi"><span>Weekly Hours</span><strong>31h 20m</strong><small>submitted + active</small></div><div class="kpi"><span>Completed Today</span><strong>2</strong><small>tasks</small></div><div class="kpi good"><span>Utilization</span><strong>86%</strong><small>current week</small></div><div class="kpi"><span>Task State</span><strong style="font-size:13px">${t.status}</strong><small>${t.id}</small></div></div><div class="workspace-grid"><section class="panel"><div class="current-task"><small>${t.id}</small><h2>${t.name}</h2><div class="phase">Phase · ${t.phase}</div><div class="timer" id="timer">${ftime(rec)}</div><div class="timer-meta"><div><span>Planned time</span><b>${ftime(t.planned*3600)}</b></div><div><span>Recorded time</span><b id="recorded">${ftime(rec)}</b></div><div><span>Remaining</span><b id="remaining">${ftime(remaining)}</b></div></div><div class="controls">${taskControls(t)}</div></div></section><section class="panel"><div class="panel-head"><div><h3>Append-only sessions</h3><p>Resume creates a new session; prior rows are never rewritten.</p></div></div><div class="session-list">${sessions.length?sessions.map(s=>`<div class="session-row"><span>${s.id}</span><div><b>${s.start} → ${s.end}</b><span>${s.type}</span></div><strong>${s.duration}</strong></div>`).join(''):'<div class="empty">No sessions for this task yet.</div>'}</div></section></div><div class="audit-note">Only one active timer is allowed per member. Actual hours are calculated from work sessions; revision work is tracked separately from original execution.</div>`;bindWorkspace(t);document.querySelector('[data-other]')?.addEventListener('click',()=>attemptStart('TASK-0242'))}
function taskControls(t){if(activeTask===t.id)return `<button class="btn warn" id="pauseBtn">Pause</button><button class="btn primary" id="completeBtn">Complete</button><button class="btn" id="revisionBtn">Revision / Redo</button>`;if(t.status==='Paused')return `<button class="btn primary" id="resumeBtn">Resume</button><button class="btn" id="revisionBtn">Revision / Redo</button>`;return `<button class="btn primary" id="startBtn">Start Task</button><button class="btn" id="revisionBtn">Revision / Redo</button>`}
function bindWorkspace(t){document.getElementById('startBtn')?.addEventListener('click',()=>attemptStart(t.id));document.getElementById('resumeBtn')?.addEventListener('click',()=>startSession(t.id,'Standard','resumed'));document.getElementById('pauseBtn')?.addEventListener('click',pauseSession);document.getElementById('completeBtn')?.addEventListener('click',completeTask);document.getElementById('revisionBtn')?.addEventListener('click',()=>revisionModal(t.id))}
function attemptStart(id){if(activeTask&&activeTask!==id){concurrentModal(id);return}selectedTask=id;startSession(id,'Standard','started')}
function startSession(id,type='Standard',verb='started'){selectedTask=id;activeTask=id;sessionElapsed=0;sessionStarted=Date.now();const t=tasks.find(x=>x.id===id);t.status=type==='Revision'?'Revision':'In Progress';clearInterval(timerHandle);timerHandle=setInterval(()=>{sessionElapsed=Math.floor((Date.now()-sessionStarted)/1000);const task=currentTask(),rec=recordedNow(task);const el=document.getElementById('timer'),r=document.getElementById('recorded'),rem=document.getElementById('remaining');if(el)el.textContent=ftime(rec);if(r)r.textContent=ftime(rec);if(rem)rem.textContent=ftime(Math.max(0,task.planned*3600-rec))},1000);addActivity('Maria Santos',verb,id);view='My Workspace';nav();render();toast(`${id} ${verb} · active work session created`)}
function closeActive(action,typeOverride){if(!activeTask)return null;const t=tasks.find(x=>x.id===activeTask),seconds=Math.max(1,sessionElapsed),start=new Date(sessionStarted||Date.now()-seconds*1000),end=new Date();t.recorded+=seconds;const type=typeOverride||(t.status==='Revision'?'Revision':'Standard');const id=`TL-${1205+timeLogs.length}`;timeLogs.unshift({id,member:'Maria Santos',task:t.id,start:start.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}),end:end.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}),duration:(seconds/3600).toFixed(2)+' h',type});clearInterval(timerHandle);timerHandle=null;activeTask=null;sessionStarted=null;sessionElapsed=0;addActivity('Maria Santos',action,t.id);return t}
function pauseSession(){const t=closeActive('paused');if(!t)return;t.status='Paused';render();toast(`${t.id} paused · append-only session recorded`)}
function completeTask(){const t=activeTask?closeActive('completed'):currentTask();t.status='Review';addActivity('Maria Santos','submitted for review',t.id);render();toast(`${t.id} completed · task moved to Review`)}
function concurrentModal(nextId){const current=tasks.find(t=>t.id===activeTask),next=tasks.find(t=>t.id===nextId);showModal(`<h2>Another task is currently active.</h2><p><b>${current.id} · ${current.name}</b> is accumulating time. The system will not allow two concurrent timers.</p><p>Start <b>${next.id} · ${next.name}</b> only after the current session is paused.</p><div class="modal-actions"><button class="btn" data-close>Cancel</button><button class="btn primary" id="pauseSwitch">Pause Current & Start This Task</button></div>`,()=>{document.getElementById('pauseSwitch').onclick=()=>{const t=closeActive('auto-paused before task switch');if(t)t.status='Paused';closeModal();startSession(nextId,'Standard','started')}})}
function revisionModal(taskId){const t=tasks.find(x=>x.id===taskId);showModal(`<h2>Revision / Redo Work</h2><p>Revision work is recorded separately from the original task execution.</p><label>Reason</label><textarea id="revisionReason" rows="3">Supervisor requested workflow adjustment</textarea><label>Additional planned hours</label><input id="revisionHours" type="number" step="0.5" min="0.5" value="2"><div class="modal-actions"><button class="btn" data-close>Cancel</button><button class="btn primary" id="createRevision">Create Revision</button></div>`,()=>{document.getElementById('createRevision').onclick=()=>{const reason=document.getElementById('revisionReason').value.trim(),hours=Number(document.getElementById('revisionHours').value)||2,rev=`REV-${taskId.replace('TASK-','')}-${String(revisionCounter++).padStart(2,'0')}`;t.planned+=hours;addActivity('Maria Santos',`created revision · ${reason}`,rev);closeModal();startSession(taskId,'Revision','started revision');toast(`${rev} created · ${hours.toFixed(1)}h planned revision`)}})}
function showModal(html,after){const m=document.createElement('div');m.className='modal';m.id='modal';m.innerHTML=`<div class="modal-card">${html}</div>`;document.body.appendChild(m);m.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal);after?.()}
function closeModal(){document.getElementById('modal')?.remove()}
function teamView(){document.getElementById('content').innerHTML=head('Resource capacity','Team','Availability, actual work, rework, and utilization from member sessions.')+`<div class="grid3">${team.map(m=>`<article class="capacity-card"><header><div><h3>${m.name}</h3><p>${m.role}</p></div>${pill(m.availability)}</header><div class="progress"><i style="width:${m.util}%"></i></div><div class="capacity-stats"><div><span>Actual</span><b>${m.actual.toFixed(1)} h</b></div><div><span>Rework</span><b>${m.rework.toFixed(1)} h</b></div><div><span>Utilization</span><b>${m.util}%</b></div></div></article>`).join('')}</div>`}
function logsView(){document.getElementById('content').innerHTML=head('Work-session evidence','Time Logs','Append-only standard and revision sessions. Actual hours are calculated from these rows.')+`<section class="panel"><div class="table-wrap"><table class="table"><thead><tr><th>Log ID</th><th>Member</th><th>Task</th><th>Start</th><th>End</th><th>Duration</th><th>Type</th></tr></thead><tbody>${timeLogs.map(l=>`<tr><td>${l.id}</td><td>${l.member}</td><td>${l.task}</td><td>${l.start}</td><td>${l.end}</td><td>${l.duration}</td><td>${pill(l.type)}</td></tr>`).join('')}</tbody></table></div></section><div class="audit-note">Work-session records are append-only. Pausing closes a session; resuming creates a new row instead of rewriting the previous one.</div>`}
function approvalsView(){const gross=13737.5;document.getElementById('content').innerHTML=head('Week 36','Approvals','Supervisor review separates recorded work from approved payable labor input.')+`<div class="kpis"><div class="kpi"><span>Regular Work</span><strong>36.50 h</strong><small>standard sessions</small></div><div class="kpi warn"><span>Revision Work</span><strong>2.75 h</strong><small>separate rework</small></div><div class="kpi"><span>Total Submitted</span><strong>39.25 h</strong><small>Maria Santos</small></div><div class="kpi"><span>Rate</span><strong>₱350</strong><small>per hour</small></div><div class="kpi good"><span>Gross Labor Input</span><strong>₱${gross.toLocaleString(undefined,{minimumFractionDigits:2})}</strong><small>approved work-log input</small></div></div><section class="panel"><div class="panel-head"><div><h3>Maria Santos · Week 36 Timesheet</h3><p>Only an approved timesheet feeds project labor-cost and compensation input calculations.</p></div>${pill(timesheetStatus)}</div><div class="panel-body"><div class="actions" style="justify-content:flex-start"><button class="btn warn" id="adjustBtn">Request Adjustment</button><button class="btn primary" id="approveBtn" ${timesheetStatus==='Approved'?'disabled':''}>Approve Timesheet</button></div></div></section><div class="audit-note">This is approved work-log based compensation input, not a complete payroll system. Taxes, statutory deductions, benefits, payslips, and other payroll functions are outside the demonstrated scope.</div>`;document.getElementById('adjustBtn').onclick=()=>{timesheetStatus='Adjustment Requested';addActivity('Alex Rivera','requested timesheet adjustment','TS-W36-MS');render();toast('Adjustment requested · member notified')};document.getElementById('approveBtn').onclick=()=>{timesheetStatus='Approved';addActivity('Alex Rivera','approved timesheet','TS-W36-MS');render();toast('Timesheet approved · labor input released')}}
function costsView(){const phases=[['Discovery',48,44],['Development',180,197],['Testing',92,88],['Deployment',45,39],['Documentation',55,50]];document.getElementById('content').innerHTML=head('Approved labor analytics','Labor Costs','Planned-versus-actual effort and project labor-cost reporting from approved work sessions.')+`<div class="kpis"><div class="kpi"><span>Labor Budget</span><strong>₱105,000</strong><small>project baseline</small></div><div class="kpi good"><span>Actual Labor Cost</span><strong>₱99,250</strong><small>approved work</small></div><div class="kpi good"><span>Variance</span><strong>−₱5,750</strong><small>under budget</small></div><div class="kpi warn"><span>Rework Cost</span><strong>₱5,250</strong><small>revision sessions</small></div><div class="kpi"><span>Approved-hours rule</span><strong style="font-size:13px">Enforced</strong><small>pending hours excluded</small></div></div><section class="panel"><div class="panel-head"><div><h3>Planned vs actual hours by phase</h3><p>Green = planned · blue = actual.</p></div></div><div class="panel-body">${phases.map(r=>`<div class="cost-row"><label>${r[0]}</label><div class="series"><i style="width:${r[1]/200*100}%"></i></div><div class="series actual"><i style="width:${r[2]/200*100}%"></i></div><b>${r[1]} / ${r[2]}h</b></div>`).join('')}</div></section><div class="audit-note">Labor cost is calculated from approved hours × controlled labor rate. Revision cost remains separately reportable for rework analysis and project-budget variance.</div>`}
function activityView(){document.getElementById('content').innerHTML=head('Audit trail','Activity','Task, timer, revision, approval, and notification actions create auditable events.')+`<section class="panel"><div class="activity-list">${activities.map(a=>`<div class="activity-item"><time>${a.time}</time><b>${esc(a.actor)}</b><span>${esc(a.action)} · ${esc(a.entity)}</span><strong class="audit-id">${a.audit}</strong></div>`).join('')}</div></section>`}
function render(){if(view==='Overview')overview();else if(view==='Projects')projectsView();else if(view==='Task Board')taskBoard();else if(view==='Timeline')timeline();else if(view==='My Workspace')workspace();else if(view==='Team')teamView();else if(view==='Time Logs')logsView();else if(view==='Approvals')approvalsView();else if(view==='Labor Costs')costsView();else activityView()}
nav();render();
</script>
</body>
</html>
