<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Enterprise Zoho CRM Engineering & Migration — Demo</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;min-height:100%;overflow:hidden;background:#eef2f7;font-family:Arial,Helvetica,sans-serif;color:#1d2a3c}
button,input{font:inherit}.migration-app{width:100%;height:100vh;min-height:100vh;display:grid;grid-template-rows:54px minmax(0,1fr);background:#eef2f7;overflow:hidden}
.topbar{height:54px;background:#263f58;color:#fff;display:grid;grid-template-columns:260px 1fr 220px;align-items:center;padding:0 18px;border-bottom:1px solid #1f3449}.brand{font-size:13px;font-weight:700;white-space:nowrap}.topnav{height:100%;display:flex;justify-content:center;align-items:stretch;gap:3px;min-width:0}.topnav button{position:relative;border:0;background:transparent;color:#dbe5ef;padding:0 8px;font-size:9px;cursor:pointer;white-space:nowrap}.topnav button.active{color:#fff;font-weight:700}.topnav button.active:after{content:"";position:absolute;left:7px;right:7px;bottom:0;height:2px;background:#fff}.workspace{text-align:right;font-size:9px;text-transform:uppercase;letter-spacing:.07em;color:#d6e0ea;font-weight:700}
.appbody{min-height:0;height:100%;display:grid;grid-template-columns:220px minmax(0,1fr);background:#eef2f7;overflow:hidden}.sidebar{height:100%;background:#fff;border-right:1px solid #d9e0e8;padding:18px 12px;overflow:auto}.sidebar h4{margin:0 9px 13px;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:#8290a2}.sidebar button{width:100%;display:flex;align-items:center;gap:8px;border:0;background:transparent;border-radius:6px;padding:9px 10px;text-align:left;color:#526176;font-size:10px;cursor:pointer;margin:2px 0}.sidebar button:before{content:"";width:5px;height:5px;border-radius:1px;background:#b2bdca;flex:0 0 auto}.sidebar button.active,.sidebar button:hover{background:#eaf0ff;color:#315fd7;font-weight:700}.sidebar button.active:before{background:#315fd7}
.main{height:100%;min-height:0;background:#f3f6fa;padding:18px;overflow:auto}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.toolbar h1{font-size:23px;line-height:1.1;margin:0;color:#1e2a39}.toolbar small{display:block;margin-bottom:5px;color:#7b899a;font-size:8px;text-transform:uppercase;letter-spacing:.08em}.btn{height:34px;padding:0 12px;border:1px solid #d1d9e3;border-radius:6px;background:#fff;color:#425168;font-size:10px;font-weight:700;cursor:pointer}.btn:hover{border-color:#9eacc0}.btn.primary{background:#3561df;border-color:#3561df;color:#fff}.btn.warn{background:#fff7e7;border-color:#e4a42f;color:#80570b}.btn.danger{background:#fff0f1;border-color:#d85b67;color:#a32a37}.btn[disabled]{opacity:.42;cursor:not-allowed}.actionrow{display:flex;gap:7px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card,.panel{background:#fff;border:1px solid #dce3eb;border-radius:7px}.card{padding:17px}.card strong{display:block;font-size:25px;letter-spacing:-.03em;color:#213044}.card span{display:block;margin-top:5px;color:#7b8999;font-size:9px;line-height:1.35}.panel{padding:17px}.panel h3{margin:0 0 8px;font-size:14px}.muted{font-size:10px;color:#68778a;line-height:1.6;margin:0 0 16px}.sectiongrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}.threegrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:12px}
.pipeline{display:grid;grid-template-columns:repeat(8,minmax(110px,1fr));gap:7px;align-items:stretch;overflow:auto;padding-bottom:4px}.pipe{position:relative;border:1px solid #dde4ed;background:#fff;padding:12px 10px;min-height:92px;border-radius:6px}.pipe:not(:last-child):after{content:"→";position:absolute;right:-9px;top:36px;z-index:2;color:#8a98aa;background:#f3f6fa;padding:1px}.pipe b{display:block;font-size:10px;color:#27364a}.pipe span{display:block;font-size:8px;color:#7b8999;line-height:1.45;margin-top:5px}.pipe.source{border-top:3px solid #4c76e5}.pipe.clean{border-top:3px solid #33a785}.pipe.ai{border-top:3px solid #9b61cf}.pipe.review{border-top:3px solid #e4a42f}.pipe.target{border-top:3px solid #4d9f78}
.endpoint{display:grid;grid-template-columns:120px 72px minmax(260px,1fr) 130px 90px;gap:0;border:1px solid #e0e5ec;border-bottom:0;background:#fff}.endpoint:last-child{border-bottom:1px solid #e0e5ec}.endpoint>div{padding:10px;border-right:1px solid #e8edf3;font-size:9px;line-height:1.4;overflow-wrap:anywhere}.endpoint>div:last-child{border-right:0}.endpoint.head{background:#f7f9fc;color:#6b788a;font-weight:700}.method{font-weight:700;color:#315fd7}.mono{font:9px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;color:#33455d}.badge{display:inline-block;padding:4px 7px;border-radius:999px;background:#e8f7ef;color:#197450;font-size:8px;font-weight:700}.badge.warn{background:#fff4d8;color:#8a6100}.badge.blue{background:#eaf0ff;color:#315fd7}.badge.gray{background:#eef1f5;color:#657285}
.mapping{display:grid;grid-template-columns:minmax(190px,.8fr) 34px minmax(280px,1.2fr);gap:8px;align-items:center}.mapping div:not(.arrow){background:#fff;border:1px solid #e0e5ec;border-radius:6px;padding:10px 12px}.mapping strong{display:block;font-size:11px}.mapping small{display:block;margin-top:5px;color:#778699;font-size:9px;line-height:1.35}.mapping .arrow{text-align:center;color:#8794a3}
.rule{border:1px solid #e0e5ec;background:#fff;border-radius:6px;padding:13px}.rule b{display:block;font-size:11px;color:#2d3b4e}.rule span{display:block;font-size:9px;color:#728094;line-height:1.5;margin-top:5px}.rule code{display:block;margin-top:8px;padding:7px;background:#f5f7fa;color:#425168;font:8px/1.45 ui-monospace,Menlo,monospace;border-radius:4px;white-space:normal}
.progressrow{margin:0 0 14px}.progressrow small{display:flex;justify-content:space-between;margin-bottom:7px;color:#637286;font-size:9px}.progress{height:9px;border-radius:999px;background:#e8edf4;overflow:hidden}.progress i{height:100%;display:block;background:#4d9f78;transition:width .25s ease}.runhead{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}.runstate{display:inline-flex;align-items:center;gap:7px;font-size:10px;font-weight:700}.runstate:before{content:"";width:8px;height:8px;border-radius:50%;background:#929eac}.runstate.running:before{background:#36a46f;box-shadow:0 0 0 3px #e5f4ec}.runstate.paused:before{background:#e4a42f}.runstate.stopped:before{background:#d85b67}.runstate.completed:before{background:#315fd7}.runmetrics{display:grid;grid-template-columns:repeat(5,minmax(100px,1fr));gap:8px;margin-top:12px}.runmetric{padding:11px;background:#f7f9fc;border:1px solid #e2e7ee}.runmetric b{display:block;font-size:15px}.runmetric span{font-size:8px;color:#7c8999}.timeline{display:grid;gap:9px}.event{display:grid;grid-template-columns:82px 1fr;gap:10px;border-left:2px solid #d8e0eb;padding-left:10px;font-size:9px}.event time{color:#8794a5}.event strong{color:#344256}.event span{display:block;color:#7b8999;margin-top:3px;line-height:1.4}
.code{margin:0;background:#111923;color:#dce7f3;border-radius:7px;padding:16px;white-space:pre-wrap;font:9px/1.7 ui-monospace,SFMono-Regular,Menlo,monospace}.jsonkey{color:#9fd3ff}.jsonstr{color:#c8e6a7}.ai-layout{display:grid;grid-template-columns:minmax(240px,.72fr) minmax(420px,1.28fr);gap:12px}.ai-steps{display:grid;gap:8px}.ai-step{display:grid;grid-template-columns:30px 1fr;gap:9px;align-items:start;border:1px solid #e0e5ec;background:#fff;padding:10px}.ai-step i{width:26px;height:26px;border-radius:50%;background:#efe8f8;color:#7850a2;display:grid;place-items:center;font-style:normal;font-size:9px;font-weight:700}.ai-step b{display:block;font-size:10px}.ai-step span{display:block;font-size:8px;color:#788598;line-height:1.45;margin-top:3px}
table{width:100%;border-collapse:collapse}th,td{padding:9px 10px;border-bottom:1px solid #e5e9ef;text-align:left;font-size:9px;line-height:1.4}th{background:#f7f9fc;color:#67778b}.status{display:inline-block;padding:5px 7px;border-radius:999px;background:#e8f7ef;color:#197450;font-size:8px;font-weight:700}.status.review{background:#fff4d8;color:#8a6100}.status.fail{background:#fff0f1;color:#a32a37}.note{padding:11px 13px;background:#f7f9fc;border:1px solid #e2e7ed;font-size:9px;line-height:1.5;color:#667487;margin-top:12px}
@media(max-width:1100px){.topbar{grid-template-columns:220px 1fr 130px}.topnav button{padding:0 5px;font-size:8px}.kpis{grid-template-columns:repeat(2,1fr)}.pipeline{grid-template-columns:repeat(8,130px)}.endpoint{grid-template-columns:105px 60px minmax(220px,1fr) 110px 80px}.runmetrics{grid-template-columns:repeat(3,1fr)}}
@media(max-width:900px){.topbar{grid-template-columns:1fr auto}.topnav{display:none}.workspace{display:none}.appbody{grid-template-columns:1fr}.sidebar{display:none}.sectiongrid,.threegrid,.ai-layout{grid-template-columns:1fr}.mapping{grid-template-columns:1fr}.mapping .arrow{display:none}.endpoint{min-width:760px}.panel.endpoint-panel{overflow:auto}}
</style>
</head>
<body>
<div class="migration-app">
<header class="topbar"><div class="brand">Zoho Migration Control Center</div><nav class="topnav" id="topnav"></nav><div class="workspace">Production reconstruction</div></header>
<div class="appbody"><aside class="sidebar"><h4>Migration pipeline</h4><div id="sidenav"></div></aside><main class="main"><div class="toolbar"><div><small>Recruitment data migration</small><h1 id="pageTitle">Migration Overview</h1></div><div id="pageActions"></div></div><div id="page"></div></main></div>
</div>
<script>
const pages=['Migration Overview','Source Connections','Data Cleaning & Deduplication','AI Resume Extraction','Field Mapping','Migration Control','Deluge Functions','API Usage','Reconciliation'];
const tabs=['Overview','Sources','Data Quality','AI Extract','Mappings','Control','Reconciliation'];
const tabToPage={Overview:'Migration Overview',Sources:'Source Connections','Data Quality':'Data Cleaning & Deduplication','AI Extract':'AI Resume Extraction',Mappings:'Field Mapping',Control:'Migration Control',Reconciliation:'Reconciliation'};
let current='Migration Overview';
const mappings=[
['resume_filename','Source Resume Filename','Trace source row and match to stored resume file'],['gdrive_link','Resume File Link','Preserve authorized Google Drive evidence and recruiter access path'],['first_name','First Name','AI-extracted / source-normalized candidate identity'],['last_name','Last Name','AI-extracted / source-normalized candidate identity'],['email','Email','Normalized candidate email'],['mobile','Mobile','Canonical phone format'],['secondary_email','Secondary Email','Secondary contact field'],['company','Current / Previous Company','AI-extracted employment context'],['designation','Designation','AI-extracted professional title'],['skills','Professional Skills','Structured AI-extracted skills'],['years_experience','Years of Experience','Calculated from structured employment history'],['education','Education Summary','AI-extracted education history'],['employment_history','Employment History','Structured professional experience summary'],['street / state / zip','Candidate Address','Normalized candidate address'],['facility-applied','Facility Lookup','Alias-normalized target facility relationship in Zoho'],['confidence','Migration Confidence','Review gate for uncertain parsed data'],['filename_date','Source File Date','Source timing and batch validation'],['license','License / Credentials','AI/source-extracted qualification field']
];
const sourceEndpoints=[
['JazzHR','GET','https://api.resumatorapi.com/v1/applicants','API key · REDACTED','Connected'],
['Apploi','GET','https://<tenant-api-host>/candidates','Source credential · REDACTED','Connected'],
['Google Drive','GET','https://www.googleapis.com/drive/v3/files/{fileId}?alt=media','OAuth 2.0 · scoped folder access','Connected'],
['Zoho CRM / Recruit','POST','https://www.zohoapis.com/crm/v2/Leads','OAuth 2.0 · module-scoped','Target']
];
const run={state:'PAUSED',batch:'JHR-028',total:5000,processed:3218,migrated:3064,exceptions:31,duplicates:123,started:'2026-09-05 18:22',events:[['18:22','Batch started','Locked 5,000-row manifest'],['18:24','Source reads active','JazzHR + Drive intake running'],['18:31','Data-quality gate','123 duplicate candidates held / merged by rule'],['18:36','Operator pause','Batch checkpoint saved at row 3,218']]};
let runTimer=null;
const topnav=document.getElementById('topnav'),sidenav=document.getElementById('sidenav'),page=document.getElementById('page'),title=document.getElementById('pageTitle'),actions=document.getElementById('pageActions');
function activeTab(){return current==='Migration Overview'?'Overview':current==='Source Connections'?'Sources':current==='Data Cleaning & Deduplication'?'Data Quality':current==='AI Resume Extraction'?'AI Extract':current==='Field Mapping'?'Mappings':current==='Migration Control'?'Control':'Reconciliation'}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function nav(){topnav.innerHTML=tabs.map(t=>`<button class="${activeTab()===t?'active':''}" data-tab="${t}">${t}</button>`).join('');sidenav.innerHTML=pages.map(p=>`<button class="${current===p?'active':''}" data-page="${p}">${p}</button>`).join('');topnav.querySelectorAll('button').forEach(b=>b.onclick=()=>{current=tabToPage[b.dataset.tab];render()});sidenav.querySelectorAll('button').forEach(b=>b.onclick=()=>{current=b.dataset.page;render()});}
function pipelineMarkup(){return `<section class="panel"><h3>End-to-end migration path</h3><p class="muted">Two ATS sources plus Google Drive resume files feed a controlled transformation pipeline before any candidate is written to Zoho.</p><div class="pipeline"><div class="pipe source"><b>JazzHR API</b><span>Applicant records · source IDs · contact metadata</span></div><div class="pipe source"><b>Apploi API</b><span>Candidate records · application context · source IDs</span></div><div class="pipe source"><b>Google Drive</b><span>Resume files retrieved by authorized file reference</span></div><div class="pipe clean"><b>Clean + Normalize</b><span>Emails, phones, names, dates, facilities, nulls, encodings</span></div><div class="pipe clean"><b>Deduplicate</b><span>Source ID · normalized contact · resume hash · match score</span></div><div class="pipe ai"><b>AI Resume Extract</b><span>Professional profile, work history, skills, education, credentials</span></div><div class="pipe review"><b>Validate + Review</b><span>Confidence thresholds · facility lookup · exception queue</span></div><div class="pipe target"><b>Zoho API</b><span>Controlled create/update · read-back verification · reconciliation</span></div></div></section>`;}
function overview(){return `<section class="kpis"><article class="card"><strong>120,000+</strong><span>overall recruitment migration program</span></article><article class="card"><strong>59,000+</strong><span>JazzHR source scope</span></article><article class="card"><strong>62,000+</strong><span>Apploi source scope</span></article><article class="card"><strong>3 inputs</strong><span>JazzHR API · Apploi API · Google Drive resumes</span></article></section>${pipelineMarkup()}<div class="sectiongrid"><section class="panel"><h3>Data quality before destination writes</h3><table><tbody><tr><td>Normalization</td><td>Email / phone / name / date / facility aliases</td><td><span class="status">Required</span></td></tr><tr><td>Deduplication</td><td>Source IDs + normalized contact + resume hash</td><td><span class="status">Required</span></td></tr><tr><td>AI extraction</td><td>Professional fields from resume body</td><td><span class="status">Structured</span></td></tr><tr><td>Confidence gate</td><td>Low-confidence records routed to review</td><td><span class="status review">Human review</span></td></tr></tbody></table></section><section class="panel"><h3>Current migration run</h3><div class="runhead"><span class="runstate ${run.state.toLowerCase()}">${run.state}</span><span class="badge blue">${run.batch}</span></div><div class="progressrow"><small><span>${run.processed.toLocaleString()} processed</span><span>${Math.round(run.processed/run.total*100)}%</span></small><div class="progress"><i style="width:${run.processed/run.total*100}%"></i></div></div><p class="muted">Migration state is checkpointed so a paused run can resume from the last safe record instead of restarting the batch.</p></section></div>`;}
function sources(){return `<section class="panel endpoint-panel"><h3>Source and destination connections</h3><p class="muted">Public reconstruction shows the integration contract while credentials, tenant identifiers, and private source hosts remain redacted. The Apploi host is intentionally sanitized rather than presented as a public universal endpoint.</p><div class="endpoint head"><div>System</div><div>Method</div><div>Endpoint contract</div><div>Authentication</div><div>State</div></div>${sourceEndpoints.map(r=>`<div class="endpoint"><div><b>${esc(r[0])}</b></div><div class="method">${esc(r[1])}</div><div class="mono">${esc(r[2])}</div><div>${esc(r[3])}</div><div><span class="badge ${r[4]==='Target'?'blue':''}">${esc(r[4])}</span></div></div>`).join('')}</section><div class="sectiongrid"><section class="panel"><h3>Google Drive resume intake</h3><div class="timeline"><div class="event"><time>01</time><strong>Read gdrive_link / file ID<span>Resume file reference is tied back to the source candidate record.</span></strong></div><div class="event"><time>02</time><strong>Drive API metadata check<span>Validate file exists, MIME type, access scope, modified time, and source filename.</span></strong></div><div class="event"><time>03</time><strong>Download resume bytes<span>Authorized file content is streamed to the extraction step; credentials remain outside the record payload.</span></strong></div><div class="event"><time>04</time><strong>Hash + provenance<span>SHA-256 file fingerprint and source IDs support dedupe and traceability.</span></strong></div></div></section><section class="panel"><h3>Source identity contract</h3><table><thead><tr><th>Source</th><th>Stable key</th><th>Used for</th></tr></thead><tbody><tr><td>JazzHR</td><td class="mono">jazzhr_applicant_id</td><td>Pagination, safe re-run, dedupe</td></tr><tr><td>Apploi</td><td class="mono">apploi_candidate_id</td><td>Pagination, safe re-run, dedupe</td></tr><tr><td>Google Drive</td><td class="mono">fileId + sha256</td><td>Resume provenance and duplicate-file detection</td></tr><tr><td>Zoho</td><td class="mono">zoho_record_id</td><td>Read-back verification / reconciliation</td></tr></tbody></table></section></div>`;}
function dataQuality(){return `<section class="kpis"><article class="card"><strong>5,000</strong><span>sample rows in locked batch manifest</span></article><article class="card"><strong>184</strong><span>duplicate candidate groups detected</span></article><article class="card"><strong>129</strong><span>safe duplicate merges / source links consolidated</span></article><article class="card"><strong>55</strong><span>ambiguous duplicate groups held for review</span></article></section><div class="sectiongrid"><section class="panel"><h3>Cleaning and normalization rules</h3><div class="threegrid"><div class="rule"><b>Email normalization</b><span>Trim, lowercase, validate syntax, convert empty strings to null.</span><code>Jane.Doe@Example.com → jane.doe@example.com</code></div><div class="rule"><b>Phone normalization</b><span>Remove punctuation, preserve country context, compare canonical digits.</span><code>(415) 555-0188 → +14155550188</code></div><div class="rule"><b>Name normalization</b><span>Whitespace cleanup, casing, suffix handling, Unicode normalization.</span><code>  MARIA  dela CRUZ → Maria dela Cruz</code></div><div class="rule"><b>Date normalization</b><span>Parse source-specific date formats into one ISO-compatible representation.</span><code>09/03/26 → 2026-09-03</code></div><div class="rule"><b>Facility alias mapping</b><span>Normalize spelling and legacy names before Zoho lookup resolution.</span><code>St. Mary's - SF → FAC-014</code></div><div class="rule"><b>Null / encoding cleanup</b><span>Remove placeholder values, malformed whitespace, control characters, and invalid text encodings.</span><code>"N/A" / "null" / "-" → null</code></div></div></section><section class="panel"><h3>Deduplication decision ladder</h3><table><thead><tr><th>Priority</th><th>Rule</th><th>Action</th></tr></thead><tbody><tr><td>1</td><td>Exact source candidate ID already processed</td><td><span class="status">Update / skip duplicate create</span></td></tr><tr><td>2</td><td>Same normalized email + phone</td><td><span class="status">High-confidence candidate match</span></td></tr><tr><td>3</td><td>Same resume SHA-256 fingerprint</td><td><span class="status">Consolidate resume provenance</span></td></tr><tr><td>4</td><td>Name + contact similarity without exact key</td><td><span class="status review">Manual duplicate review</span></td></tr><tr><td>5</td><td>No candidate match</td><td><span class="status">Create candidate</span></td></tr></tbody></table><div class="note"><strong>Important:</strong> deduplication happens before Zoho create operations. Ambiguous matches are held rather than silently merged.</div></section></div>`;}
function aiExtraction(){return `<div class="ai-layout"><section class="panel"><h3>Resume → structured professional profile</h3><p class="muted">Google Drive provides the resume file. Text is extracted, normalized, sent to a structured AI extraction contract, validated, and then merged with trusted source fields.</p><div class="ai-steps"><div class="ai-step"><i>01</i><div><b>Drive resume download</b><span>PDF / DOCX / supported image file retrieved using authorized file reference.</span></div></div><div class="ai-step"><i>02</i><div><b>Text extraction</b><span>Resume body is converted to normalized text while file provenance remains attached.</span></div></div><div class="ai-step"><i>03</i><div><b>Structured AI extraction</b><span>Professional identity, employment, skills, education, credentials, and experience are returned in a fixed schema.</span></div></div><div class="ai-step"><i>04</i><div><b>Validation + confidence</b><span>Schema, required fields, source conflicts, and per-field confidence are checked.</span></div></div><div class="ai-step"><i>05</i><div><b>Merge / review gate</b><span>Trusted ATS values take precedence where configured; uncertain AI fields enter review instead of being auto-written.</span></div></div></div></section><section class="panel"><h3>Synthetic structured AI output</h3><pre class="code">{
  <span class="jsonkey">"candidate_name"</span>: <span class="jsonstr">"Alex Rivera"</span>,
  <span class="jsonkey">"professional_title"</span>: <span class="jsonstr">"Registered Nurse"</span>,
  <span class="jsonkey">"current_company"</span>: <span class="jsonstr">"Regional Medical Center"</span>,
  <span class="jsonkey">"years_experience"</span>: 7.4,
  <span class="jsonkey">"skills"</span>: [<span class="jsonstr">"acute care"</span>, <span class="jsonstr">"EMR"</span>, <span class="jsonstr">"patient assessment"</span>],
  <span class="jsonkey">"education"</span>: [{<span class="jsonkey">"degree"</span>: <span class="jsonstr">"BS Nursing"</span>}],
  <span class="jsonkey">"licenses"</span>: [{<span class="jsonkey">"type"</span>: <span class="jsonstr">"RN"</span>, <span class="jsonkey">"state"</span>: <span class="jsonstr">"CA"</span>}],
  <span class="jsonkey">"employment_history"</span>: [
    {<span class="jsonkey">"role"</span>: <span class="jsonstr">"Staff RN"</span>, <span class="jsonkey">"company"</span>: <span class="jsonstr">"Regional Medical Center"</span>}
  ],
  <span class="jsonkey">"professional_summary"</span>: <span class="jsonstr">"Acute-care nursing experience..."</span>,
  <span class="jsonkey">"confidence"</span>: 0.94
}</pre><div class="note">Synthetic example only. Resume bodies and real candidate PII are not included in the public reconstruction.</div></section></div><div class="sectiongrid"><section class="panel"><h3>AI-derived professional fields</h3><table><tbody><tr><td>Professional title / designation</td><td>Structured string</td></tr><tr><td>Current / previous company</td><td>Structured employment context</td></tr><tr><td>Skills</td><td>Normalized skill list</td></tr><tr><td>Years of experience</td><td>Calculated from employment chronology</td></tr><tr><td>Education</td><td>Degree / institution / dates where available</td></tr><tr><td>Licenses / credentials</td><td>Type / state / identifier where available</td></tr><tr><td>Employment history</td><td>Role / company / duration records</td></tr></tbody></table></section><section class="panel"><h3>Confidence and conflict handling</h3><table><tbody><tr><td>≥ 0.90 + no source conflict</td><td><span class="status">Eligible for controlled write</span></td></tr><tr><td>0.75 – 0.89</td><td><span class="status review">Review selected fields</span></td></tr><tr><td>&lt; 0.75</td><td><span class="status fail">Hold candidate record</span></td></tr><tr><td>ATS vs resume conflict</td><td><span class="status review">Preserve source + review difference</span></td></tr></tbody></table></section></div>`;}
function fieldMapping(){return `<section class="panel"><h3>Source + AI → Zoho field map</h3><p class="muted">Trusted ATS fields, normalized values, Google Drive provenance, and AI-derived professional data are merged under explicit precedence rules before the destination write.</p><div class="mapping">${mappings.map(r=>`<div><strong>${esc(r[0])}</strong><small>Source / derived field</small></div><div class="arrow">→</div><div><strong>${esc(r[1])}</strong><small>${esc(r[2])}</small></div>`).join('')}</div></section>`;}
function stateClass(){return run.state==='RUNNING'?'running':run.state==='PAUSED'?'paused':run.state==='STOPPED'?'stopped':run.state==='COMPLETED'?'completed':'';}
function controlMarkup(){const pct=Math.min(100,run.processed/run.total*100);return `<section class="panel" id="migrationControl"><div class="runhead"><div><h3 style="margin-bottom:5px">${run.batch} · controlled migration run</h3><span class="runstate ${stateClass()}">${run.state}</span></div><div class="actionrow"><button class="btn primary" data-run="start" ${run.state==='RUNNING'?'disabled':''}>Start</button><button class="btn warn" data-run="pause" ${run.state!=='RUNNING'?'disabled':''}>Pause</button><button class="btn primary" data-run="resume" ${run.state!=='PAUSED'?'disabled':''}>Resume</button><button class="btn danger" data-run="stop" ${!['RUNNING','PAUSED'].includes(run.state)?'disabled':''}>Stop</button></div></div><div class="progressrow"><small><span>${run.processed.toLocaleString()} / ${run.total.toLocaleString()} records processed</span><span>${pct.toFixed(1)}%</span></small><div class="progress"><i style="width:${pct}%"></i></div></div><div class="runmetrics"><div class="runmetric"><b>${run.migrated.toLocaleString()}</b><span>migrated / verified</span></div><div class="runmetric"><b>${run.exceptions.toLocaleString()}</b><span>review exceptions</span></div><div class="runmetric"><b>${run.duplicates.toLocaleString()}</b><span>duplicate candidates handled</span></div><div class="runmetric"><b>${Math.max(0,run.total-run.processed).toLocaleString()}</b><span>remaining</span></div><div class="runmetric"><b>${run.state}</b><span>checkpoint state</span></div></div><div class="note"><strong>State behavior:</strong> Pause saves the current checkpoint and stops new source reads. Resume continues from the next safe record. Stop closes the run deliberately; starting again creates a fresh controlled execution rather than silently continuing a stopped batch.</div></section><div class="sectiongrid"><section class="panel"><h3>Run event timeline</h3><div class="timeline">${run.events.slice(-7).reverse().map(e=>`<div class="event"><time>${esc(e[0])}</time><strong>${esc(e[1])}<span>${esc(e[2])}</span></strong></div>`).join('')}</div></section><section class="panel"><h3>Batch safety controls</h3><table><tbody><tr><td>Manifest lock</td><td><span class="status">Enabled</span></td></tr><tr><td>Source pagination checkpoint</td><td><span class="status">Enabled</span></td></tr><tr><td>Duplicate create guard</td><td><span class="status">Enabled</span></td></tr><tr><td>Rate-limit backoff</td><td><span class="status">Enabled</span></td></tr><tr><td>Low-confidence auto-write</td><td><span class="status fail">Blocked</span></td></tr><tr><td>Destination read-back</td><td><span class="status">Required</span></td></tr></tbody></table></section></div>`;}
function nowTime(){return new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});}
function runAction(action){if(action==='start'){clearInterval(runTimer);run.state='RUNNING';run.processed=0;run.migrated=0;run.exceptions=0;run.duplicates=0;run.events.push([nowTime(),'Fresh run started','Manifest locked; source cursors reset for controlled execution']);startTimer();}if(action==='pause'&&run.state==='RUNNING'){run.state='PAUSED';clearInterval(runTimer);run.events.push([nowTime(),'Migration paused',`Checkpoint saved after ${run.processed.toLocaleString()} processed records`]);}if(action==='resume'&&run.state==='PAUSED'){run.state='RUNNING';run.events.push([nowTime(),'Migration resumed',`Continued from checkpoint ${run.processed.toLocaleString()}`]);startTimer();}if(action==='stop'&&['RUNNING','PAUSED'].includes(run.state)){run.state='STOPPED';clearInterval(runTimer);run.events.push([nowTime(),'Migration stopped by operator','Run closed intentionally; no new source reads']);}render();}
function startTimer(){clearInterval(runTimer);runTimer=setInterval(()=>{if(run.state!=='RUNNING')return;const inc=Math.min(37,run.total-run.processed);run.processed+=inc;run.duplicates+=Math.random()<.25?1:0;run.exceptions+=Math.random()<.18?1:0;run.migrated=Math.max(0,run.processed-run.exceptions-run.duplicates);if(run.processed>=run.total){run.state='COMPLETED';clearInterval(runTimer);run.events.push([nowTime(),'Migration completed','All source rows received a migrated, duplicate, or exception disposition']);}if(current==='Migration Control')render();},700);}
function deluge(){return `<section class="panel"><h3>Zoho-side reliability function</h3><p class="muted">Migration writes are followed by controlled Zoho-side validation / logging where required.</p><pre class="code">validate destination record ID\nfetch live candidate record\npreserve existing history / subform rows\nappend migration event\nupdate with trigger behavior explicitly controlled\nrefetch + verify expected destination state</pre><button class="btn primary" id="delugeTest">Run synthetic verification</button></section>`;}
function apiUsage(){const calls=[['18:22:03','JazzHR applicant page','GET','api.resumatorapi.com/v1/applicants','200','250 rows'],['18:22:05','Apploi candidate page','GET','<tenant-api-host>/candidates','200','250 rows'],['18:22:07','Drive resume metadata','GET','googleapis.com/drive/v3/files/{fileId}','200','PDF · 184 KB'],['18:22:08','Drive resume download','GET','googleapis.com/drive/v3/files/{fileId}?alt=media','200','streamed'],['18:22:10','Zoho candidate search','GET','zohoapis.com/crm/v2/Leads/search','200','NO_MATCH'],['18:22:11','Zoho candidate create','POST','zohoapis.com/crm/v2/Leads','201','CREATED'],['18:22:12','Zoho read-back','GET','zohoapis.com/crm/v2/Leads/{recordId}','200','VERIFIED'],['18:24:41','Zoho create rate limit','POST','zohoapis.com/crm/v2/Leads','429','backoff + retry'],['18:24:43','Zoho retry 1','POST','zohoapis.com/crm/v2/Leads','201','CREATED']];return `<section class="panel endpoint-panel"><h3>Cross-system API execution</h3><p class="muted">This page shows the source reads, Google Drive resume retrieval, duplicate-safe Zoho search, destination create/update, and verification path—not only Zoho-side calls.</p><table><thead><tr><th>Time</th><th>Operation</th><th>Method</th><th>Endpoint</th><th>HTTP</th><th>Outcome</th></tr></thead><tbody>${calls.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td class="method">${r[2]}</td><td class="mono">${esc(r[3])}</td><td>${r[4]}</td><td>${r[5]}</td></tr>`).join('')}</tbody></table><div class="note">Credentials, tenant identifiers, access tokens, private candidate identifiers, and resume contents are intentionally redacted from the public reconstruction.</div></section>`;}
function reconcile(){return `<section class="kpis"><article class="card"><strong>5,000</strong><span>source rows in sample batch</span></article><article class="card"><strong>4,761</strong><span>destination records created / updated</span></article><article class="card"><strong>184</strong><span>duplicate dispositions</span></article><article class="card"><strong>55</strong><span>manual review / exception dispositions</span></article></section><div class="sectiongrid"><section class="panel"><h3>Migration reconciliation</h3><table><thead><tr><th>Disposition</th><th>Count</th><th>Verification rule</th></tr></thead><tbody><tr><td><span class="status">Migrated / updated</span></td><td>4,761</td><td>Zoho record ID + read-back state verified</td></tr><tr><td><span class="status">Duplicate handled</span></td><td>184</td><td>Matched candidate / provenance linked; duplicate create prevented</td></tr><tr><td><span class="status review">Review / exception</span></td><td>55</td><td>Low confidence, ambiguous duplicate, facility, license, or file access issue</td></tr><tr><td>Unaccounted</td><td><b>0</b></td><td>All source rows have a final disposition</td></tr></tbody></table></section><section class="panel"><h3>What is reconciled</h3><table><tbody><tr><td>Source candidate ID</td><td>JazzHR / Apploi stable reference retained</td></tr><tr><td>Resume provenance</td><td>Drive file ID + filename + hash linked</td></tr><tr><td>AI extraction</td><td>Validated professional fields / confidence state recorded</td></tr><tr><td>Deduplication</td><td>Match decision and merged / held disposition recorded</td></tr><tr><td>Facility lookup</td><td>Target Zoho lookup ID verified</td></tr><tr><td>Destination</td><td>Zoho record read-back after write</td></tr></tbody></table></section></div>`;}
function render(){nav();title.textContent=current;actions.innerHTML='';if(current==='Migration Overview')page.innerHTML=overview();if(current==='Source Connections')page.innerHTML=sources();if(current==='Data Cleaning & Deduplication')page.innerHTML=dataQuality();if(current==='AI Resume Extraction')page.innerHTML=aiExtraction();if(current==='Field Mapping')page.innerHTML=fieldMapping();if(current==='Migration Control'){page.innerHTML=controlMarkup();page.querySelectorAll('[data-run]').forEach(b=>b.onclick=()=>runAction(b.dataset.run));}if(current==='Deluge Functions'){page.innerHTML=deluge();document.getElementById('delugeTest').onclick=e=>e.currentTarget.textContent='HTTP 200 · destination verified';}if(current==='API Usage')page.innerHTML=apiUsage();if(current==='Reconciliation')page.innerHTML=reconcile();}
render();
</script>
