<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Enterprise Zoho CRM Engineering & Migration — Demo</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eef2f7;font-family:Arial,Helvetica,sans-serif;color:#1d2a3c}button{font:inherit}.migration-app{width:100%;height:100vh;display:grid;grid-template-rows:54px minmax(0,1fr);overflow:hidden}.topbar{height:54px;background:#263f58;color:#fff;display:grid;grid-template-columns:260px 1fr 220px;align-items:center;padding:0 18px;border-bottom:1px solid #1f3449}.brand{font-size:13px;font-weight:700;white-space:nowrap}.topnav{height:100%;display:flex;justify-content:center;align-items:stretch;gap:5px}.topnav button{position:relative;border:0;background:transparent;color:#dbe5ef;padding:0 10px;font-size:10px;cursor:pointer}.topnav button.active{color:#fff;font-weight:700}.topnav button.active:after{content:"";position:absolute;left:8px;right:8px;bottom:0;height:2px;background:#fff}.workspace{text-align:right;font-size:9px;text-transform:uppercase;letter-spacing:.07em;color:#d6e0ea;font-weight:700}.appbody{min-height:0;height:100%;display:grid;grid-template-columns:210px minmax(0,1fr);overflow:hidden}.sidebar{height:100%;background:#fff;border-right:1px solid #d9e0e8;padding:18px 12px;overflow:auto}.sidebar h4{margin:0 9px 13px;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:#8290a2}.sidebar button{width:100%;display:flex;align-items:center;gap:8px;border:0;background:transparent;border-radius:6px;padding:10px;text-align:left;color:#526176;font-size:11px;cursor:pointer;margin:2px 0}.sidebar button:before{content:"";width:5px;height:5px;border-radius:1px;background:#b2bdca}.sidebar button.active,.sidebar button:hover{background:#eaf0ff;color:#315fd7;font-weight:700}.sidebar button.active:before{background:#315fd7}.main{height:100%;min-height:0;background:#f3f6fa;padding:18px;overflow:auto}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.toolbar h1{font-size:23px;line-height:1.1;margin:0;color:#1e2a39}.toolbar small{display:block;margin-bottom:5px;color:#7b899a;font-size:8px;text-transform:uppercase;letter-spacing:.08em}.btn{height:34px;padding:0 12px;border:1px solid #d1d9e3;border-radius:6px;background:#fff;color:#425168;font-size:10px;font-weight:700;cursor:pointer}.btn.primary{background:#3561df;border-color:#3561df;color:#fff}.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card,.panel{background:#fff;border:1px solid #dce3eb;border-radius:7px}.card{padding:17px}.card strong{display:block;font-size:26px;color:#213044}.card span{display:block;margin-top:5px;color:#7b8999;font-size:9px}.panel{padding:17px;margin-bottom:12px}.panel h3{margin:0 0 14px;font-size:14px}.muted{font-size:10px;color:#68778a;line-height:1.6;margin:0 0 16px}.mapping{display:grid;grid-template-columns:minmax(190px,.8fr) 34px minmax(280px,1.2fr);gap:8px;align-items:center}.mapping div:not(.arrow){background:#fff;border:1px solid #e0e5ec;border-radius:6px;padding:10px 12px}.mapping strong{display:block;font-size:11px}.mapping small{display:block;margin-top:5px;color:#778699;font-size:9px}.mapping .arrow{text-align:center;color:#8794a3}.progressrow{margin:0 0 18px}.progressrow small{display:block;margin-bottom:7px;color:#637286;font-size:9px}.progress{height:8px;border-radius:999px;background:#e8edf4;overflow:hidden}.progress i{height:100%;display:block;background:#4d9f78}.timeline{display:grid;gap:10px}.event{display:grid;grid-template-columns:70px 1fr;gap:10px;border-left:2px solid #d8e0eb;padding-left:10px;font-size:10px}.event time{color:#8794a5}.event strong{color:#344256}.code{margin:0 0 14px;background:#111923;color:#dce7f3;border-radius:7px;padding:16px;white-space:pre-wrap;font:10px/1.7 ui-monospace,monospace}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #e5e9ef;text-align:left;font-size:10px}th{background:#f7f9fc;color:#67778b}.status{display:inline-block;padding:5px 7px;border-radius:999px;background:#e8f7ef;color:#197450;font-size:9px;font-weight:700}.status.partial{background:#fff4d8;color:#8a6100}.status.review{background:#eef1f5;color:#5b6878}.report-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.report-meta{font-size:9px;line-height:1.7;color:#68778a}.notice{padding:11px 13px;background:#f7f9fc;border:1px solid #e2e7ed;font-size:9px;line-height:1.5;color:#667487;margin-top:14px}.fillspace{min-height:420px}@media(max-width:900px){.topbar{grid-template-columns:1fr auto}.topnav,.workspace,.sidebar{display:none}.appbody{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}.mapping{grid-template-columns:1fr}.mapping .arrow{display:none}}
</style></head><body><div class="migration-app"><header class="topbar"><div class="brand">Zoho Migration Control Center</div><nav class="topnav" id="topnav"></nav><div class="workspace">Demo workspace</div></header><div class="appbody"><aside class="sidebar"><h4>Migration</h4><div id="sidenav"></div></aside><main class="main"><div class="toolbar"><div><small>Migration operations</small><h1 id="pageTitle">Migration Overview</h1></div><div id="pageActions"></div></div><div id="page"></div></main></div></div>
<script>
const pages=['Migration Overview','Field Mapping','Import Batches','Deluge Functions','API Usage','Reconciliation','Compliance Report'];
const tabs=['Overview','Mappings','Batches','Functions','Reconciliation','Compliance'];
const tabToPage={Overview:'Migration Overview',Mappings:'Field Mapping',Batches:'Import Batches',Functions:'Deluge Functions',Reconciliation:'Reconciliation',Compliance:'Compliance Report'};let current='Migration Overview';
const mappings=[['resume_filename','Source Resume Filename','Trace source row and match to stored resume file'],['gdrive_link','Resume File Link','Preserve Google Drive evidence and recruiter access path'],['first_name','First Name','Candidate identity'],['last_name','Last Name','Candidate identity'],['email','Email','Primary dedupe and contact field'],['mobile','Mobile','Phone normalization and duplicate check'],['secondary_email','Secondary Email','Secondary contact field'],['company','Current / Previous Company','Employment context'],['designation','Designation','Role title / experience context'],['street','Street','Candidate address'],['state','State','Candidate address'],['zip','Zip Code','Candidate address'],['facility-applied','Facility Lookup','Target facility relationship in Zoho'],['confidence','Migration Confidence','Review gate for uncertain parsed data'],['filename_date','Source File Date','Source timing and batch validation'],['license','License','Credential / qualification field']];
const controls=[['DH-01','Personal Data Inventory','PASS','Candidate identity, contact, address, resume and qualification fields identified.'],['DH-02','Data Minimization','PASS','Migration mapping is limited to recruitment and operationally required fields.'],['DH-03','Purpose Limitation','PASS','Processing scope is constrained to recruitment migration and reconciliation.'],['DH-04','Access & Least Privilege','PARTIAL','Role and API scope review documented; production IAM evidence requires owner validation.'],['DH-05','Credential Protection','PASS','OAuth/API secrets excluded from migration records and generated evidence.'],['DH-06','Transport Security','PASS','REST integrations are represented as HTTPS/TLS protected endpoints.'],['DH-07','Migration Reconciliation','PASS','Every source row receives a migrated, duplicate or exception disposition.'],['DH-08','Data Accuracy & Confidence','PASS','Confidence scoring and exception review gate uncertain parsed candidate fields.'],['DH-09','PII-safe Operational Logging','PARTIAL','Logs are designed around IDs/statuses; production log sampling requires review.'],['DH-10','Retention & Deletion','NOT ASSESSED','Retention periods require the data owner and legal basis to be configured.'],['DH-11','Auditability','PASS','Batch, API, exception and reconciliation events provide traceable evidence.'],['DH-12','Recovery & Reliability','PASS','Controlled batches, retries and reconciliation support recoverable execution.'],['DH-13','Third-party Processing','PARTIAL','Zoho, Google Drive and source ATS dependencies identified; contractual review is external.'],['DH-14','Data Subject Rights Support','PASS','Mapped records remain identifiable for access, correction and deletion workflows.']];
const topnav=document.getElementById('topnav'),sidenav=document.getElementById('sidenav'),page=document.getElementById('page'),title=document.getElementById('pageTitle'),actions=document.getElementById('pageActions');
function activeTab(){return current==='Migration Overview'?'Overview':current==='Field Mapping'?'Mappings':current==='Import Batches'?'Batches':current==='Deluge Functions'?'Functions':current==='Compliance Report'?'Compliance':'Reconciliation'}
function nav(){topnav.innerHTML=tabs.map(t=>`<button class="${activeTab()===t?'active':''}" data-tab="${t}">${t}</button>`).join('');sidenav.innerHTML=pages.map(p=>`<button class="${current===p?'active':''}" data-page="${p}">${p}</button>`).join('');topnav.querySelectorAll('button').forEach(b=>b.onclick=()=>{current=tabToPage[b.dataset.tab];render()});sidenav.querySelectorAll('button').forEach(b=>b.onclick=()=>{current=b.dataset.page;render()})}
function complianceReport(){const pass=controls.filter(c=>c[2]==='PASS').length,partial=controls.filter(c=>c[2]==='PARTIAL').length,na=controls.filter(c=>c[2]==='NOT ASSESSED').length;return `<section class="kpis"><article class="card"><strong>${controls.length}</strong><span>controls assessed</span></article><article class="card"><strong>${pass}</strong><span>pass</span></article><article class="card"><strong>${partial}</strong><span>partial</span></article><article class="card"><strong>${na}</strong><span>not assessed</span></article></section><section class="panel" style="margin-top:12px"><div class="report-head"><div><h3>Data Handling & Compliance Assessment</h3><p class="muted">Enterprise Zoho CRM Engineering & Migration · Candidate PII · 59K+ JazzHR source scope · 120K+ overall program</p></div><div class="report-meta">Framework alignment<br><b>Philippines DPA · GDPR principles · SOC 2 control concepts · API security</b></div></div><table><thead><tr><th>Control</th><th>Area</th><th>Status</th><th>Observed evidence / assessment</th></tr></thead><tbody>${controls.map(c=>`<tr><td><b>${c[0]}</b></td><td>${c[1]}</td><td><span class="status ${c[2]==='PARTIAL'?'partial':c[2]==='NOT ASSESSED'?'review':''}">${c[2]}</span></td><td>${c[3]}</td></tr>`).join('')}</tbody></table><div class="notice"><b>Assessment boundary:</b> This demo documents technical and operational controls and supporting evidence. It is not a legal certification of GDPR, Philippine Data Privacy Act, SOC 2, or any other regulatory compliance.</div></section>`}
function downloadReport(){const date=new Date().toISOString().slice(0,10);let text=`DATA HANDLING & COMPLIANCE ASSESSMENT\nEnterprise Zoho CRM Engineering & Migration\nGenerated: ${date}\nData classification: Confidential / Candidate PII\nScope: 59K+ JazzHR / 120K+ overall migration program\n\n`;controls.forEach(c=>text+=`${c[0]} | ${c[1]} | ${c[2]}\nEvidence: ${c[3]}\n\n`);text+='DISCLAIMER\nThis report documents implemented or assessed technical and operational controls and is not a legal certification of regulatory compliance.\n';const blob=new Blob([text],{type:'text/plain'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`zoho-migration-compliance-${date}.txt`;a.click();URL.revokeObjectURL(a.href)}
function render(){nav();title.textContent=current;actions.innerHTML=current==='Import Batches'?'<button class="btn" id="runBatch">Run synthetic batch</button>':current==='Compliance Report'?'<button class="btn primary" id="generateReport">Generate compliance report</button>':'';
if(current==='Migration Overview')page.innerHTML=`<section class="kpis"><article class="card"><strong>120,000+</strong><span>overall source program</span></article><article class="card"><strong>59,000+</strong><span>JazzHR scope</span></article><article class="card"><strong>62,000+</strong><span>Apploi scope</span></article><article class="card"><strong>99.1%</strong><span>demo reconciliation rate</span></article></section><div class="fillspace"></div>`;
if(current==='Field Mapping')page.innerHTML=`<section class="panel"><h3>Resume migration field map</h3><p class="muted">Source resume rows are mapped into Zoho candidate, contact, address, facility, evidence, and review fields before batch import.</p><div class="mapping">${mappings.map(r=>`<div><strong>${r[0]}</strong><small>Source column</small></div><div class="arrow">→</div><div><strong>${r[1]}</strong><small>${r[2]}</small></div>`).join('')}</div></section>`;
if(current==='Import Batches'){page.innerHTML=`<section class="panel" id="batchLog"><h3>Batch Progress</h3><div class="progressrow"><small>Batch JHR-027</small><div class="progress"><i style="width:88%"></i></div></div><div class="progressrow"><small>Batch APP-014</small><div class="progress"><i style="width:62%"></i></div></div></section>`;document.getElementById('runBatch').onclick=()=>document.getElementById('batchLog').innerHTML=`<h3>Synthetic batch JHR-028</h3><div class="timeline"><div class="event"><time>Step 1</time><strong>Source manifest locked · resume_filename + gdrive_link verified</strong></div><div class="event"><time>Step 2</time><strong>Candidate/contact/address normalization complete · 37 confidence exceptions</strong></div><div class="event"><time>Step 3</time><strong>Facility lookup and license validation complete · 121 duplicates</strong></div><div class="event"><time>Step 4</time><strong>Controlled import complete · every source row received a disposition</strong></div></div>`}
if(current==='Deluge Functions')page.innerHTML=`<section class="panel"><h3>automation.FillRecruitmentLogs1</h3><pre class="code">validate record ID\nfetch live Lead\npreserve Recruitment_Logs subform rows\nappend new stage log\nupdate record with triggers suppressed\nrefetch + verify expected row count</pre><button class="btn primary" onclick="this.textContent='HTTP 200 · Success'">Run test execution</button></section>`;
if(current==='API Usage')page.innerHTML=`<section class="panel"><h3>API Operations</h3><div class="timeline"><div class="event"><time>10:08</time><strong>Get Record by ID · 200</strong></div><div class="event"><time>10:08</time><strong>Search Records · 200</strong></div><div class="event"><time>10:09</time><strong>Update Record · 200</strong></div></div></section>`;
if(current==='Reconciliation')page.innerHTML=`<section class="panel"><h3>Migration reconciliation</h3><table><thead><tr><th>Disposition</th><th>Count</th><th>Rule</th></tr></thead><tbody><tr><td><span class="status">Migrated</span></td><td>4,812</td><td>Accepted + verified</td></tr><tr><td>Duplicate</td><td>143</td><td>Email / mobile / resume filename</td></tr><tr><td>Exception</td><td>45</td><td>Low confidence, missing facility, or license review</td></tr></tbody></table></section>`;
if(current==='Compliance Report'){page.innerHTML=`<section class="panel"><h3>Compliance report generator</h3><p class="muted">Generate an evidence-based control assessment covering privacy, data handling, migration integrity, access, API security, auditability, retention and operational resilience.</p><div class="notice">The generator uses PASS, PARTIAL and NOT ASSESSED statuses rather than claiming formal regulatory certification.</div></section>`;document.getElementById('generateReport').onclick=()=>{page.innerHTML=complianceReport();actions.innerHTML='<button class="btn" id="downloadReport">Download report</button>';document.getElementById('downloadReport').onclick=downloadReport}}
render();
</script></body></html>
