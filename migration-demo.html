ext-transform:uppercase;letter-spacing:.08em}.btn{height:34px;padding:0 12px;border:1px solid #d1d9e3;border-radius:6px;background:#fff;color:#425168;font-size:10px;font-weight:700;cursor:pointer}.btn.primary{background:#3561df;border-color:#3561df;color:#fff}.btn.warn{background:#fff7e7;border-color:#e4a42f;color:#80570b}.btn.danger{background:#fff0f1;border-color:#d85b67;color:#a32a37}.btn[disabled]{opacity:.42;cursor:not-allowed}.actionrow{display:flex;gap:7px;flex-wrap:wrap}.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card,.panel{background:#fff;border:1px solid #dce3eb;border-radius:7px}.card{padding:17px}.card strong{display:block;font-size:25px;color:#213044}.card span{display:block;margin-top:5px;color:#7b8999;font-size:9px;line-height:1.35}.panel{padding:17px}.panel h3{margin:0 0 8px;font-size:14px}.muted{font-size:10px;color:#68778a;line-height:1.6;margin:0 0 16px}.sectiongrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}.threegrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:12px}.pipeline{display:grid;grid-template-columns:repeat(9,minmax(112px,1fr));gap:7px;overflow:auto;padding-bottom:4px}.pipe{position:relative;border:1px solid #dde4ed;background:#fff;padding:12px 10px;min-height:92px;border-radius:6px}.pipe:not(:last-child):after{content:"→";position:absolute;right:-9px;top:36px;z-index:2;color:#8a98aa;background:#f3f6fa;padding:1px}.pipe b{display:block;font-size:10px;color:#27364a}.pipe span{display:block;font-size:8px;color:#7b8999;line-height:1.45;margin-top:5px}.pipe.source{border-top:3px solid #4c76e5}.pipe.clean{border-top:3px solid #33a785}.pipe.ai{border-top:3px solid #9b61cf}.pipe.review{border-top:3px solid #e4a42f}.pipe.target{border-top:3px solid #4d9f78}.endpoint{display:grid;grid-template-columns:145px 72px minmax(290px,1fr) 140px 92px;border:1px solid #e0e5ec;border-bottom:0;background:#fff}.endpoint:last-child{border-bottom:1px solid #e0e5ec}.endpoint>div{padding:10px;border-right:1px solid #e8edf3;font-size:9px;line-height:1.4;overflow-wrap:anywhere}.endpoint>div:last-child{border-right:0}.endpoint.head{background:#f7f9fc;color:#6b788a;font-weight:700}.method{font-weight:700;color:#315fd7}.mono{font:9px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;color:#33455d}.badge{display:inline-block;padding:4px 7px;border-radius:999px;background:#e8f7ef;color:#197450;font-size:8px;font-weight:700}.badge.warn{background:#fff4d8;color:#8a6100}.badge.blue{background:#eaf0ff;color:#315fd7}.badge.gray{background:#eef1f5;color:#657285}.mapping{display:grid;grid-template-columns:minmax(190px,.8fr) 34px minmax(280px,1.2fr);gap:8px;align-items:center}.mapping div:not(.arrow){background:#fff;border:1px solid #e0e5ec;border-radius:6px;padding:10px 12px}.mapping strong{display:block;font-size:11px}.mapping small{display:block;margin-top:5px;color:#778699;font-size:9px;line-height:1.35}.mapping .arrow{text-align:center;color:#8794a3}.rule{border:1px solid #e0e5ec;background:#fff;border-radius:6px;padding:13px}.rule b{display:block;font-size:11px}.rule span{display:block;font-size:9px;color:#728094;line-height:1.5;margin-top:5px}.rule code{display:block;margin-top:8px;padding:7px;background:#f5f7fa;color:#425168;font:8px/1.45 ui-monospace,Menlo,monospace;border-radius:4px}.progressrow{margin:0 0 14px}.progressrow small{display:flex;justify-content:space-between;margin-bottom:7px;color:#637286;font-size:9px}.progress{height:9px;border-radius:999px;background:#e8edf4;overflow:hidden}.progress i{height:100%;display:block;background:#4d9f78;transition:width .25s ease}.runhead{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}.runstate{display:inline-flex;align-items:center;gap:7px;font-size:10px;font-weight:700}.runstate:before{content:"";width:8px;height:8px;border-radius:50%;background:#929eac}.runstate.running:before{background:#36a46f}.runstate.paused:before{background:#e4a42f}.runstate.stopped:before{background:#d85b67}.runstate.completed:before{background:#315fd7}.runmetrics{display:grid;grid-template-columns:repeat(5,minmax(100px,1fr));gap:8px;margin-top:12px}.runmetric{padding:11px;background:#f7f9fc;border:1px solid #e2e7ee}.runmetric b{display:block;font-size:15px}.runmetric span{font-size:8px;color:#7c8999}.timeline{display:grid;gap:9px}.event{display:grid;grid-template-columns:82px 1fr;gap:10px;border-left:2px solid #d8e0eb;padding-left:10px;font-size:9px}.event time{color:#8794a5}.event strong{color:#344256}.event span{display:block;color:#7b8999;margin-top:3px;line-height:1.4}.code{margin:0;background:#111923;color:#dce7f3;border-radius:7px;padding:16px;white-space:pre-wrap;font:9px/1.7 ui-monospace,SFMono-Regular,Menlo,monospace}.jsonkey{color:#9fd3ff}.jsonstr{color:#c8e6a7}.ai-layout{display:grid;grid-template-columns:minmax(240px,.72fr) minmax(420px,1.28fr);gap:12px}.ai-steps{display:grid;gap:8px}.ai-step{display:grid;grid-template-columns:30px 1fr;gap:9px;border:1px solid #e0e5ec;background:#fff;padding:10px}.ai-step i{width:26px;height:26px;border-radius:50%;background:#efe8f8;color:#7850a2;display:grid;place-items:center;font-style:normal;font-size:9px;font-weight:700}.ai-step b{display:block;font-size:10px}.ai-step span{display:block;font-size:8px;color:#788598;line-height:1.45;margin-top:3px}table{width:100%;border-collapse:collapse}th,td{padding:9px 10px;border-bottom:1px solid #e5e9ef;text-align:left;font-size:9px;line-height:1.4}th{background:#f7f9fc;color:#67778b}.status{display:inline-block;padding:5px 7px;border-radius:999px;background:#e8f7ef;color:#197450;font-size:8px;font-weight:700}.status.review{background:#fff4d8;color:#8a6100}.status.fail{background:#fff0f1;color:#a32a37}.note{padding:11px 13px;background:#f7f9fc;border:1px solid #e2e7ed;font-size:9px;line-height:1.5;color:#667487;margin-top:12px}.source-picker{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:10px 0 14px}.source-option{border:1px solid #dce3eb;background:#fff;padding:12px;display:flex;gap:10px;align-items:flex-start}.source-option input{margin-top:2px}.source-option b{display:block;font-size:10px}.source-option span{display:block;font-size:8px;color:#758397;line-height:1.45;margin-top:4px}.mode-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0 14px}.mode-btn{height:30px;border:1px solid #d1d9e3;background:#fff;color:#526176;padding:0 11px;border-radius:5px;font-size:9px;font-weight:700;cursor:pointer}.mode-btn.active{background:#eaf0ff;border-color:#9db4ee;color:#315fd7}.source-runs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}.source-run{border:1px solid #dce3eb;background:#fff;padding:13px}.source-run h4{margin:0 0 4px;font-size:11px}.source-run .meta{font-size:8px;color:#788699;margin-bottom:9px}.source-run .source-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:9px}.source-run .source-stats div{background:#f7f9fc;padding:7px}.source-run .source-stats b{display:block;font-size:11px}.source-run .source-stats span{font-size:7px;color:#7d8997}.source-run.inactive{opacity:.55}.upload-chip{display:inline-block;padding:4px 7px;background:#edf7f1;color:#197450;font-size:8px;font-weight:700;border-radius:999px}
@media(max-width:1100px){.topbar{grid-template-columns:220px 1fr 130px}.kpis{grid-template-columns:repeat(2,1fr)}.pipeline{grid-template-columns:repeat(9,130px)}.endpoint{grid-template-columns:120px 60px minmax(240px,1fr) 120px 80px}.runmetrics{grid-template-columns:repeat(3,1fr)}}@media(max-width:900px){.topbar{grid-template-columns:1fr auto}.topnav,.workspace,.sidebar{display:none}.appbody{grid-template-columns:1fr}.sectiongrid,.threegrid,.ai-layout,.source-picker,.source-runs{grid-template-columns:1fr}.mapping{grid-template-columns:1fr}.mapping .arrow{display:none}.endpoint{min-width:800px}.panel.endpoint-panel{overflow:auto}}

<body>
<div class="migration-app"><header class="topbar"><div class="brand">Zoho Migration Control Center</div><nav class="topnav" id="topnav"></nav><div class="workspace">Production reconstruction</div></header><div class="appbody"><aside class="sidebar"><h4>Migration pipeline</h4><div id="sidenav"></div></aside><main class="main"><div class="toolbar"><div><small>Recruitment data migration</small><h1 id="pageTitle">Migration Overview</h1></div><div id="pageActions"></div></div><div id="page"></div></main></div></div>
<script>
const pages=['Migration Overview','Source Connections','Data Cleaning & Deduplication','AI Resume Extraction','Field Mapping','Migration Control','Deluge Functions','API Usage','Reconciliation'];
const tabs=['Overview','Sources','Data Quality','AI Extract','Mappings','Control','Reconciliation'];
const tabToPage={Overview:'Migration Overview',Sources:'Source Connections','Data Quality':'Data Cleaning & Deduplication','AI Extract':'AI Resume Extraction',Mappings:'Field Mapping',Control:'Migration Control',Reconciliation:'Reconciliation'};
let current='Migration Overview';
const mappings=[['resume_filename','Source Resume Filename','Preserve original file name and source traceability'],['gdrive_link','Resume Source Link','Preserve authorized Google Drive source reference'],['first_name','First Name','Extracted from the source resume and normalized'],['last_name','Last Name','Extracted from the source resume and normalized'],['email','Email','Extracted then normalized / validated'],['mobile','Mobile','Extracted then converted to canonical phone format'],['address','Candidate Address','Extracted basic address data where present'],['company','Current / Previous Company','AI-extracted employment context'],['designation','Designation','AI-extracted professional title'],['skills','Professional Skills','Structured AI-extracted skills'],['years_experience','Years of Experience','Calculated from structured employment history'],['education','Education Summary','AI-extracted education history'],['employment_history','Employment History','Structured professional experience'],['facility-applied','Facility Lookup','Normalized target facility relationship in Zoho'],['confidence','Migration Confidence','Review gate for uncertain extraction'],['license','License / Credentials','Extracted qualification data'],['resume_file','Zoho Resume Attachment','Upload the original resume file to the created / matched candidate record']];
const sourceEndpoints=[['JazzHR archive / Google Drive','LIST','https://www.googleapis.com/drive/v3/files?q={folderQuery}','OAuth 2.0 · scoped folder access','Source'],['JazzHR resume file','GET','https://www.googleapis.com/drive/v3/files/{fileId}?alt=media','OAuth 2.0 · scoped folder access','Source'],['Apploi','GET','https://<configured-apploi-api-base>/candidates','Source credential · REDACTED','Source'],['Zoho candidate search','GET','https://www.zohoapis.com/crm/v8/Leads/search','OAuth 2.0 · module-scoped','Target'],['Zoho candidate write','POST / PUT','https://www.zohoapis.com/crm/v8/Leads','OAuth 2.0 · module-scoped','Target'],['Zoho resume attachment','POST','https://www.zohoapis.com/crm/v8/Leads/{recordId}/Attachments','OAuth 2.0 · record-scoped','Target']];
const sources={
 jazzhr:{key:'jazzhr',name:'JazzHR archive / Google Drive',scope:59000,total:5000,processed:3218,migrated:3027,exceptions:31,duplicates:160,uploads:3027,state:'PAUSED',checkpoint:3218,selected:true,source:'Google Drive folder + resume files'},
 apploi:{key:'apploi',name:'Apploi',scope:62000,total:5000,processed:1844,migrated:1762,exceptions:22,duplicates:60,uploads:1736,state:'PAUSED',checkpoint:1844,selected:true,source:'Configured Apploi API'}
};
const run={state:'PAUSED',mode:'parallel',id:'MIG-20260905-01',events:[['18:22','Run started','JazzHR Drive and Apploi lanes opened with independent checkpoints'],['18:24','Parallel processing active','Both selected source lanes processing concurrently'],['18:31','Resume uploads verified','Original resume files attached after successful Zoho candidate writes'],['18:36','Operator pause','Both source checkpoints persisted independently']]};
let runTimer=null;const topnav=document.getElementById('topnav'),sidenav=document.getElementById('sidenav'),page=document.getElementById('page'),title=document.getElementById('pageTitle'),actions=document.getElementById('pageActions');
function activeTab(){return current==='Migration Overview'?'Overview':current==='Source Connections'?'Sources':current==='Data Cleaning & Deduplication'?'Data Quality':current==='AI Resume Extraction'?'AI Extract':current==='Field Mapping'?'Mappings':current==='Migration Control'?'Control':'Reconciliation'}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function selectedSources(){return Object.values(sources).filter(s=>s.selected)}function totals(){const ss=selectedSources();return {total:ss.reduce((a,s)=>a+s.total,0),processed:ss.reduce((a,s)=>a+s.processed,0),migrated:ss.reduce((a,s)=>a+s.migrated,0),exceptions:ss.reduce((a,s)=>a+s.exceptions,0),duplicates:ss.reduce((a,s)=>a+s.duplicates,0),uploads:ss.reduce((a,s)=>a+s.uploads,0)}}
function nav(){topnav.innerHTML=tabs.map(t=>`<button class="${activeTab()===t?'active':''}" data-tab="${t}">${t}</button>`).join('');sidenav.innerHTML=pages.map(p=>`<button class="${current===p?'active':''}" data-page="${p}">${p}</button>`).join('');topnav.querySelectorAll('button').forEach(b=>b.onclick=()=>{current=tabToPage[b.dataset.tab];render()});sidenav.querySelectorAll('button').forEach(b=>b.onclick=()=>{current=b.dataset.page;render()});}
function pipelineMarkup(){return `<section class="panel"><h3>End-to-end migration path</h3><p class="muted">JazzHR migration begins in Google Drive—not a JazzHR API. The Drive resume/file is the source used to extract candidate basics and professional data. Apploi is a separate source lane. Both normalize into the same controlled Zoho migration contract.</p><div class="pipeline"><div class="pipe source"><b>Source Lane</b><span>JazzHR Drive folder / Apploi source selected by operator</span></div><div class="pipe source"><b>Resume / Record Intake</b><span>Drive file bytes or configured source record + resume evidence</span></div><div class="pipe clean"><b>Basic Data Extract</b><span>Name · email · phone · address · source metadata</span></div><div class="pipe clean"><b>Clean + Deduplicate</b><span>Normalize values · match candidate · resume fingerprint</span></div><div class="pipe ai"><b>AI Professional Data</b><span>Title · company · skills · experience · education · licenses</span></div><div class="pipe review"><b>Validate + Facility</b><span>Confidence gate · conflicts · facility lookup · exception queue</span></div><div class="pipe target"><b>Zoho Candidate</b><span>Duplicate-safe search / create / update + read-back</span></div><div class="pipe target"><b>Upload Resume</b><span>Attach original resume file to the Zoho candidate record</span></div><div class="pipe target"><b>Reconcile</b><span>Candidate + resume attachment + final source disposition</span></div></div></section>`;}
function overview(){const t=totals();return `<section class="kpis"><article class="card"><strong>120,000+</strong><span>overall recruitment migration program</span></article><article class="card"><strong>59,000+</strong><span>JazzHR scope processed from Google Drive</span></article><article class="card"><strong>62,000+</strong><span>Apploi source scope</span></article><article class="card"><strong>2 lanes</strong><span>select individually or process in parallel</span></article></section>${pipelineMarkup()}<div class="sectiongrid"><section class="panel"><h3>JazzHR migration source</h3><p class="muted">There is no JazzHR API in this reconstruction. JazzHR-sourced resumes/files are stored in Google Drive. The migration reads the authorized Drive folder, downloads each resume, extracts basic candidate information, derives structured professional data, cleans and deduplicates the candidate, then writes the candidate and original resume file to Zoho.</p><table><tbody><tr><td>Input</td><td>Google Drive resume / source file</td></tr><tr><td>Basic extraction</td><td>Name, contact, address and available identity fields</td></tr><tr><td>Professional extraction</td><td>Role, company, skills, experience, education, licenses</td></tr><tr><td>Destination</td><td>Zoho candidate fields + original resume attachment</td></tr></tbody></table></section><section class="panel"><h3>Current controller</h3><div class="runhead"><span class="runstate ${run.state.toLowerCase()}">${run.state}</span><span class="badge blue">${run.mode.toUpperCase()}</span></div><div class="progressrow"><small><span>${t.processed.toLocaleString()} / ${t.total.toLocaleString()} selected-lane records</span><span>${t.total?Math.round(t.processed/t.total*100):0}%</span></small><div class="progress"><i style="width:${t.total?t.processed/t.total*100:0}%"></i></div></div><p class="muted">Parallel mode keeps a separate checkpoint for every selected source lane while sharing controlled Zoho destination concurrency.</p></section></div>`;}
function sourcesPage(){return `<section class="panel endpoint-panel"><h3>Source and destination connections</h3><p class="muted">JazzHR is represented as a Google Drive archive / resume source. The public demo does not claim a JazzHR API. Apploi remains a separately configured source integration. Destination calls include the resume attachment upload.</p><div class="endpoint head"><div>System / operation</div><div>Method</div><div>Endpoint contract</div><div>Authentication</div><div>Role</div></div>${sourceEndpoints.map(r=>`<div class="endpoint"><div><b>${esc(r[0])}</b></div><div class="method">${esc(r[1])}</div><div class="mono">${esc(r[2])}</div><div>${esc(r[3])}</div><div><span class="badge ${r[4]==='Target'?'blue':''}">${r[4]}</span></div></div>`).join('')}</section><div class="sectiongrid"><section class="panel"><h3>JazzHR Drive intake</h3><div class="timeline"><div class="event"><time>01</time><strong>List authorized Drive folder<span>Discover resume/source files with file ID, filename, MIME type, modified time and Drive link.</span></strong></div><div class="event"><time>02</time><strong>Download resume/source file<span>Use Drive file ID to retrieve the document bytes.</span></strong></div><div class="event"><time>03</time><strong>Extract basic candidate data<span>Name, email, phone, address and other available identity fields are derived from the file.</span></strong></div><div class="event"><time>04</time><strong>Hash + provenance<span>File ID + SHA-256 fingerprint support duplicate-file detection and traceability.</span></strong></div><div class="event"><time>05</time><strong>Upload to Zoho<span>After the candidate is created / matched, the original resume file is attached to that Zoho record.</span></strong></div></div></section><section class="panel"><h3>Source identity contract</h3><table><thead><tr><th>Source</th><th>Stable key</th><th>Checkpoint</th></tr></thead><tbody><tr><td>JazzHR archive / Drive</td><td class="mono">drive_file_id + sha256</td><td>Last safe file / manifest index</td></tr><tr><td>Apploi</td><td class="mono">apploi_candidate_id</td><td>Source cursor / page + candidate ID</td></tr><tr><td>Zoho</td><td class="mono">zoho_record_id</td><td>Candidate read-back + attachment result</td></tr></tbody></table></section></div>`;}
function dataQuality(){return `<section class="kpis"><article class="card"><strong>Normalize</strong><span>basic fields before matching</span></article><article class="card"><strong>Dedupe</strong><span>candidate + resume evidence</span></article><article class="card"><strong>Review</strong><span>ambiguous matches held</span></article><article class="card"><strong>Attach</strong><span>original resume after Zoho write</span></article></section><div class="sectiongrid"><section class="panel"><h3>Cleaning and normalization rules</h3><div class="threegrid"><div class="rule"><b>Email</b><span>Trim, lowercase, validate, convert blank placeholders to null.</span><code>Jane.Doe@Example.com → jane.doe@example.com</code></div><div class="rule"><b>Phone</b><span>Remove punctuation and compare canonical digits.</span><code>(415) 555-0188 → +14155550188</code></div><div class="rule"><b>Name</b><span>Whitespace, casing, suffix and Unicode normalization.</span><code> MARIA  DELA CRUZ → Maria Dela Cruz</code></div><div class="rule"><b>Facility</b><span>Map aliases / legacy names to the stable Zoho lookup.</span><code>St. Mary's - SF → FAC-014</code></div><div class="rule"><b>Nulls / encoding</b><span>Remove N/A placeholders, control characters and malformed whitespace.</span><code>N/A / "" / - → null</code></div><div class="rule"><b>Resume fingerprint</b><span>Hash original bytes before destination upload.</span><code>sha256(file_bytes) → resume_dedupe_key</code></div></div></section><section class="panel"><h3>Deduplication decision ladder</h3><table><thead><tr><th>Priority</th><th>Rule</th><th>Action</th></tr></thead><tbody><tr><td>1</td><td>Existing source key / Drive file already processed</td><td><span class="status">Resume / update safely</span></td></tr><tr><td>2</td><td>Same normalized email + phone</td><td><span class="status">High-confidence candidate match</span></td></tr><tr><td>3</td><td>Same resume SHA-256</td><td><span class="status">Duplicate file / provenance match</span></td></tr><tr><td>4</td><td>Name + contact similarity without exact key</td><td><span class="status review">Manual duplicate review</span></td></tr><tr><td>5</td><td>No match</td><td><span class="status">Create candidate</span></td></tr></tbody></table><div class="note"><strong>Order matters:</strong> candidate dedupe happens before Zoho create; resume dedupe is also checked before attachment upload.</div></section></div>`;}
function aiExtraction(){return `<div class="ai-layout"><section class="panel"><h3>Google Drive resume → complete candidate profile</h3><p class="muted">For the JazzHR lane, the resume/source file in Google Drive is the actual input for both basic and professional data extraction.</p><div class="ai-steps"><div class="ai-step"><i>01</i><div><b>Drive file download</b><span>Retrieve PDF / DOCX / supported image and preserve file provenance.</span></div></div><div class="ai-step"><i>02</i><div><b>Basic field extraction</b><span>Name, email, phone, address and other available identity/contact data.</span></div></div><div class="ai-step"><i>03</i><div><b>Text normalization</b><span>Clean extracted text while retaining a reference to the original file.</span></div></div><div class="ai-step"><i>04</i><div><b>Structured AI professional extraction</b><span>Professional title, company, skills, experience, education, work history, licenses and summary.</span></div></div><div class="ai-step"><i>05</i><div><b>Confidence + conflict validation</b><span>Uncertain or contradictory fields are held before the Zoho write.</span></div></div><div class="ai-step"><i>06</i><div><b>Zoho candidate + resume</b><span>Write verified fields, then upload the original resume as a candidate attachment.</span></div></div></div></section><section class="panel"><h3>Synthetic structured extraction</h3><pre class="code">{
  <span class="jsonkey">"basic"</span>: {
    <span class="jsonkey">"first_name"</span>: <span class="jsonstr">"Alex"</span>,
    <span class="jsonkey">"last_name"</span>: <span class="jsonstr">"Rivera"</span>,
    <span class="jsonkey">"email"</span>: <span class="jsonstr">"alex@example.test"</span>,
    <span class="jsonkey">"mobile"</span>: <span class="jsonstr">"+14155550188"</span>
  },
  <span class="jsonkey">"professional"</span>: {
    <span class="jsonkey">"title"</span>: <span class="jsonstr">"Registered Nurse"</span>,
    <span class="jsonkey">"company"</span>: <span class="jsonstr">"Regional Medical Center"</span>,
    <span class="jsonkey">"years_experience"</span>: 7.4,
    <span class="jsonkey">"skills"</span>: [<span class="jsonstr">"acute care"</span>, <span class="jsonstr">"EMR"</span>],
    <span class="jsonkey">"licenses"</span>: [{<span class="jsonkey">"type"</span>: <span class="jsonstr">"RN"</span>}]
  },
  <span class="jsonkey">"confidence"</span>: 0.94,
  <span class="jsonkey">"source_file_id"</span>: <span class="jsonstr">"DRV-SYN-00481"</span>
}</pre><div class="note">Synthetic example only. The original resume file is preserved separately and uploaded to Zoho after a successful candidate write.</div></section></div>`;}
function fieldMapping(){return `<section class="panel"><h3>Extracted / normalized data → Zoho</h3><p class="muted">The mapping includes the resume itself, not just a Drive link. Candidate fields are written first; the original file is then attached to the resolved Zoho candidate record.</p><div class="mapping">${mappings.map(r=>`<div><strong>${esc(r[0])}</strong><small>Source / derived field</small></div><div class="arrow">→</div><div><strong>${esc(r[1])}</strong><small>${esc(r[2])}</small></div>`).join('')}</div></section>`;}
function stateClass(v=run.state){return v==='RUNNING'?'running':v==='PAUSED'?'paused':v==='STOPPED'?'stopped':v==='COMPLETED'?'completed':''}function nowTime(){return new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}
function sourceCard(s){const pct=s.total?s.processed/s.total*100:0;return `<section class="source-run ${s.selected?'':'inactive'}"><div class="runhead"><div><h4>${esc(s.name)}</h4><div class="meta">${esc(s.source)} · checkpoint ${s.checkpoint.toLocaleString()}</div></div><span class="runstate ${stateClass(s.state)}">${s.state}</span></div><div class="progressrow"><small><span>${s.processed.toLocaleString()} / ${s.total.toLocaleString()}</span><span>${pct.toFixed(1)}%</span></small><div class="progress"><i style="width:${pct}%"></i></div></div><div class="source-stats"><div><b>${s.migrated.toLocaleString()}</b><span>Zoho verified</span></div><div><b>${s.uploads.toLocaleString()}</b><span>resume uploads</span></div><div><b>${s.duplicates.toLocaleString()}</b><span>duplicates</span></div><div><b>${s.exceptions.toLocaleString()}</b><span>exceptions</span></div></div></section>`;}
function controlMarkup(){const t=totals();return `<section class="panel" id="migrationControl"><div class="runhead"><div><h3 style="margin-bottom:5px">Source-selectable migration controller</h3><span class="runstate ${stateClass()}">${run.state}</span></div><div class="actionrow"><button class="btn primary" data-run="start" ${run.state==='RUNNING'?'disabled':''}>Start</button><button class="btn warn" data-run="pause" ${run.state!=='RUNNING'?'disabled':''}>Pause</button><button class="btn primary" data-run="resume" ${run.state!=='PAUSED'?'disabled':''}>Resume</button><button class="btn danger" data-run="stop" ${!['RUNNING','PAUSED'].includes(run.state)?'disabled':''}>Stop</button></div></div><p class="muted">Choose one or both source lanes. Parallel mode runs selected source workers concurrently while preserving an independent checkpoint for each source and a controlled shared Zoho destination-write limit.</p><div class="source-picker">${Object.values(sources).map(s=>`<label class="source-option"><input type="checkbox" data-source-select="${s.key}" ${s.selected?'checked':''} ${run.state==='RUNNING'?'disabled':''}><span><b>${esc(s.name)}</b><span>${esc(s.source)} · program scope ${s.scope.toLocaleString()}+</span></span></label>`).join('')}</div><div class="mode-row"><b style="font-size:9px">Execution mode</b><button class="mode-btn ${run.mode==='parallel'?'active':''}" data-mode="parallel" ${run.state==='RUNNING'?'disabled':''}>Parallel selected sources</button><button class="mode-btn ${run.mode==='sequential'?'active':''}" data-mode="sequential" ${run.state==='RUNNING'?'disabled':''}>Sequential</button><span class="badge blue">${selectedSources().length} source${selectedSources().length===1?'':'s'} selected</span></div><div class="runmetrics"><div class="runmetric"><b>${t.migrated.toLocaleString()}</b><span>candidate writes verified</span></div><div class="runmetric"><b>${t.uploads.toLocaleString()}</b><span>resume files uploaded</span></div><div class="runmetric"><b>${t.duplicates.toLocaleString()}</b><span>duplicates handled</span></div><div class="runmetric"><b>${t.exceptions.toLocaleString()}</b><span>review exceptions</span></div><div class="runmetric"><b>${run.mode.toUpperCase()}</b><span>controller mode</span></div></div></section><div class="source-runs">${Object.values(sources).map(sourceCard).join('')}</div><div class="sectiongrid"><section class="panel"><h3>Run event timeline</h3><div class="timeline">${run.events.slice(-8).reverse().map(e=>`<div class="event"><time>${esc(e[0])}</time><strong>${esc(e[1])}<span>${esc(e[2])}</span></strong></div>`).join('')}</div></section><section class="panel"><h3>Parallel safety controls</h3><table><tbody><tr><td>Independent source checkpoint</td><td><span class="status">Per lane</span></td></tr><tr><td>Parallel source workers</td><td><span class="status">Supported</span></td></tr><tr><td>Shared Zoho write concurrency</td><td><span class="status">Throttled</span></td></tr><tr><td>Candidate duplicate guard</td><td><span class="status">Before create</span></td></tr><tr><td>Resume duplicate guard</td><td><span class="status">Before attachment</span></td></tr><tr><td>Low-confidence auto-write</td><td><span class="status fail">Blocked</span></td></tr></tbody></table><div class="note"><strong>Pause:</strong> stops new work in every active lane after the current safe record and persists each lane checkpoint. <strong>Resume:</strong> continues every selected lane from its own checkpoint.</div></section></div>`;}
function resetSource(s){s.processed=0;s.migrated=0;s.exceptions=0;s.duplicates=0;s.uploads=0;s.checkpoint=0;s.state='RUNNING'}
function runAction(action){const ss=selectedSources();if(action==='start'){if(!ss.length){run.events.push([nowTime(),'Start blocked','Select at least one source lane']);render();return}clearInterval(runTimer);ss.forEach(resetSource);run.state='RUNNING';run.id='MIG-'+Date.now();run.events.push([nowTime(),'Fresh run started',`${ss.map(s=>s.name).join(' + ')} · ${run.mode} execution`]);startTimer()}else if(action==='pause'&&run.state==='RUNNING'){run.state='PAUSED';clearInterval(runTimer);ss.forEach(s=>{if(s.state==='RUNNING'){s.state='PAUSED';s.checkpoint=s.processed}});run.events.push([nowTime(),'Migration paused',`Saved independent checkpoints: ${ss.map(s=>s.key+' '+s.checkpoint).join(' · ')}`])}else if(action==='resume'&&run.state==='PAUSED'){run.state='RUNNING';ss.filter(s=>s.processed<s.total).forEach(s=>s.state='RUNNING');run.events.push([nowTime(),'Migration resumed',`Continuing ${ss.length} selected source lane(s) from saved checkpoints`]);startTimer()}else if(action==='stop'&&['RUNNING','PAUSED'].includes(run.state)){run.state='STOPPED';clearInterval(runTimer);ss.forEach(s=>{if(s.processed<s.total)s.state='STOPPED';s.checkpoint=s.processed});run.events.push([nowTime(),'Migration stopped','Selected source executions closed intentionally; checkpoints retained for audit'])}render()}
function processSource(s){if(!s.selected||s.state!=='RUNNING'||s.processed>=s.total)return;const inc=Math.min(31+Math.floor(Math.random()*17),s.total-s.processed);s.processed+=inc;s.checkpoint=s.processed;if(Math.random()<.28)s.duplicates+=1;if(Math.random()<.18)s.exceptions+=1;const eligible=Math.max(0,s.processed-s.exceptions-s.duplicates);s.migrated=eligible;s.uploads=Math.max(0,eligible-(Math.random()<.2?1:0));if(s.processed>=s.total){s.state='COMPLETED';s.uploads=s.migrated;run.events.push([nowTime(),`${s.name} completed`,`Candidate writes and resume attachment outcomes reconciled for lane`])}}
function startTimer(){clearInterval(runTimer);runTimer=setInterval(()=>{if(run.state!=='RUNNING')return;const ss=selectedSources().filter(s=>s.processed<s.total);if(run.mode==='parallel')ss.forEach(processSource);else if(ss.length)processSource(ss[0]);if(selectedSources().length&&selectedSources().every(s=>s.processed>=s.total)){run.state='COMPLETED';clearInterval(runTimer);run.events.push([nowTime(),'Migration completed','All selected sources reconciled: candidate + resume + final disposition'])}if(current==='Migration Control')render()},700)}
function deluge(){return `<section class="panel"><h3>Zoho-side post-write verification</h3><p class="muted">Candidate field writes and resume attachment results are verified after the destination calls.</p><pre class="code">search / resolve destination candidate\nwrite normalized + validated candidate fields\nread back candidate state\nupload original resume attachment\nverify attachment response / attachment ID\nappend migration event\nreturn candidate + resume disposition to reconciler</pre><button class="btn primary" id="delugeTest">Run synthetic verification</button></section>`;}
function apiUsage(){const calls=[['18:22:03','Drive folder list','GET','googleapis.com/drive/v3/files?q={folderQuery}','200','JazzHR resume/source manifest'],['18:22:05','Drive resume download','GET','googleapis.com/drive/v3/files/{fileId}?alt=media','200','PDF bytes'],['18:22:07','Apploi candidate page','GET','<configured-apploi-api-base>/candidates','200','parallel source page'],['18:22:10','Zoho candidate search','GET','zohoapis.com/crm/v8/Leads/search','200','NO_MATCH'],['18:22:11','Zoho candidate create','POST','zohoapis.com/crm/v8/Leads','201','CREATED'],['18:22:12','Zoho read-back','GET','zohoapis.com/crm/v8/Leads/{recordId}','200','VERIFIED'],['18:22:13','Zoho resume upload','POST','zohoapis.com/crm/v8/Leads/{recordId}/Attachments','200','ATTACHMENT STORED'],['18:24:41','Zoho destination throttle','POST','zohoapis.com/crm/v8/Leads','429','shared backoff'],['18:24:43','Zoho retry','POST','zohoapis.com/crm/v8/Leads','201','CREATED']];return `<section class="panel endpoint-panel"><h3>Cross-system execution</h3><p class="muted">There is no JazzHR API call here. JazzHR-sourced migration work begins with Google Drive folder/file operations. Parallel source intake is allowed; Zoho writes use controlled shared concurrency and backoff.</p><table><thead><tr><th>Time</th><th>Operation</th><th>Method</th><th>Endpoint</th><th>HTTP</th><th>Outcome</th></tr></thead><tbody>${calls.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td class="method">${r[2]}</td><td class="mono">${esc(r[3])}</td><td>${r[4]}</td><td>${r[5]}</td></tr>`).join('')}</tbody></table></section>`;}
function reconcile(){const all=Object.values(sources),total=all.reduce((a,s)=>a+s.total,0),m=all.reduce((a,s)=>a+s.migrated,0),d=all.reduce((a,s)=>a+s.duplicates,0),e=all.reduce((a,s)=>a+s.exceptions,0),u=all.reduce((a,s)=>a+s.uploads,0);return `<section class="kpis"><article class="card"><strong>${total.toLocaleString()}</strong><span>sample source records / files</span></article><article class="card"><strong>${m.toLocaleString()}</strong><span>Zoho candidates created / updated</span></article><article class="card"><strong>${u.toLocaleString()}</strong><span>resume attachments uploaded</span></article><article class="card"><strong>${(d+e).toLocaleString()}</strong><span>duplicate / exception dispositions</span></article></section><div class="sectiongrid"><section class="panel"><h3>Per-source reconciliation</h3><table><thead><tr><th>Source</th><th>Processed</th><th>Zoho verified</th><th>Resume uploaded</th><th>Duplicate</th><th>Exception</th></tr></thead><tbody>${all.map(s=>`<tr><td>${esc(s.name)}</td><td>${s.processed.toLocaleString()}</td><td>${s.migrated.toLocaleString()}</td><td>${s.uploads.toLocaleString()}</td><td>${s.duplicates.toLocaleString()}</td><td>${s.exceptions.toLocaleString()}</td></tr>`).join('')}</tbody></table></section><section class="panel"><h3>Reconciliation contract</h3><table><tbody><tr><td>Source checkpoint</td><td>Drive file / source candidate cursor accounted for</td></tr><tr><td>Candidate fields</td><td>Zoho destination record read back</td></tr><tr><td>Resume file</td><td>Attachment upload response linked to candidate</td></tr><tr><td>Duplicate</td><td>No duplicate candidate / attachment silently created</td></tr><tr><td>Exception</td><td>Held with reason and source reference</td></tr><tr><td>Unaccounted</td><td><b>0 expected at completed batch close</b></td></tr></tbody></table></section></div>`;}
function render(){nav();title.textContent=current;actions.innerHTML='';if(current==='Migration Overview')page.innerHTML=overview();if(current==='Source Connections')page.innerHTML=sourcesPage();if(current==='Data Cleaning & Deduplication')page.innerHTML=dataQuality();if(current==='AI Resume Extraction')page.innerHTML=aiExtraction();if(current==='Field Mapping')page.innerHTML=fieldMapping();if(current==='Migration Control'){page.innerHTML=controlMarkup();page.querySelectorAll('[data-run]').forEach(b=>b.onclick=()=>runAction(b.dataset.run));page.querySelectorAll('[data-source-select]').forEach(input=>input.onchange=()=>{sources[input.dataset.sourceSelect].selected=input.checked;render()});page.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{run.mode=b.dataset.mode;render()})}if(current==='Deluge Functions'){page.innerHTML=deluge();document.getElementById('delugeTest').onclick=e=>e.currentTarget.textContent='Candidate + resume verified'}if(current==='API Usage')page.innerHTML=apiUsage();if(current==='Reconciliation')page.innerHTML=reconcile()}
render();
</script>
