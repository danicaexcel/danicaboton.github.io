<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Monday.com Project Operations Control Center — DCode</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}#shell{display:block;width:100%;height:100%;border:0;background:#fff}
</style>
</head>
<body>
<iframe id="shell" src="monday-project-ops-demo-native-v2.html?v=20260903-summary3" title="Interactive Monday.com Project Operations Control Center reconstruction" allowfullscreen></iframe>
<script>
(function(){
  const shell=document.getElementById('shell');
  const moneyHeaders=/Budget|Cost|Variance|Rate/i;
  const sumHeaders=/Hours|Budget|Cost|Variance|Progress|Linked Tasks|Overdue Tasks|Completed Tasks|Open Tasks|Revision Count|Duration|Rate/i;
  const peopleHeaders=/Owner|Members|Person|Collaborators|\bUser\b|Requested By|Assigned To|Approver/i;
  const statusHeaders=/Status|Priority|Health|Result|Active|Approval Required|Session Type/i;

  function num(text){
    const cleaned=String(text||'').replace(/[$,%]/g,'').replace(/,/g,'').trim();
    const match=cleaned.match(/-?\d+(?:\.\d+)?/);
    return match?Number(match[0]):NaN;
  }
  function fmt(n,isMoney){
    if(!Number.isFinite(n)) return '';
    const rounded=Math.round(n*100)/100;
    const text=rounded.toLocaleString(undefined,{maximumFractionDigits:2});
    return isMoney?'$'+text:text;
  }
  function statusColor(cell){
    const pill=cell.querySelector('.pill');
    if(!pill)return '#c4c4c4';
    const cls=[...pill.classList].find(x=>x!=='pill');
    return ({green:'#00a36c',red:'#d83a52',amber:'#fdab3d',blue:'#0086c0',purple:'#a25ddc',pink:'#e2448f',gray:'#9292a4',sky:'#579bfc'})[cls]||'#c4c4c4';
  }
  function summaryFor(header,cells,total){
    if(!header||/^Item$/i.test(header))return '';
    if(statusHeaders.test(header)){
      const colors=cells.map(statusColor).filter(Boolean);
      if(!colors.length)return '';
      const counts={};colors.forEach(c=>counts[c]=(counts[c]||0)+1);
      return '<div class="native-summary-bar" aria-label="status distribution">'+Object.entries(counts).map(([c,n])=>'<i style="background:'+c+';flex:'+n+'"></i>').join('')+'</div>';
    }
    if(peopleHeaders.test(header)){
      const filled=cells.filter(c=>{const t=c.textContent.trim();return t&&t!=='—'&&t!=='○'}).length;
      return '<span class="native-summary-number">'+filled+'/'+total+'</span>';
    }
    if(sumHeaders.test(header)){
      const values=cells.map(c=>num(c.textContent)).filter(Number.isFinite);
      if(!values.length)return '';
      const sum=values.reduce((a,b)=>a+b,0);
      return '<span class="native-summary-number">'+fmt(sum,moneyHeaders.test(header))+'<small>sum</small></span>';
    }
    return '';
  }
  function enhanceTable(table){
    if(!table||table.dataset.nativeSummary==='1')return;
    const headers=[...table.querySelectorAll('thead th')].map(th=>th.textContent.trim());
    const rows=[...table.querySelectorAll('tbody tr')];
    if(!headers.length||!rows.length)return;
    const tfoot=document.createElement('tfoot');
    const tr=document.createElement('tr');tr.className='native-summary-row';
    headers.forEach((header,index)=>{
      const td=document.createElement('td');
      td.innerHTML=summaryFor(header,rows.map(r=>r.children[index]).filter(Boolean),rows.length);
      tr.appendChild(td);
    });
    tfoot.appendChild(tr);table.appendChild(tfoot);table.dataset.nativeSummary='1';
  }
  function enhance(doc){
    if(!doc)return;
    if(!doc.getElementById('native-group-summary-style')){
      const style=doc.createElement('style');style.id='native-group-summary-style';style.textContent=`
        .table-scroll{scrollbar-width:none!important;-ms-overflow-style:none!important;overscroll-behavior-inline:contain}
        .table-scroll::-webkit-scrollbar{width:0!important;height:0!important;display:none!important}
        .tabs{scrollbar-width:none!important;-ms-overflow-style:none!important}.tabs::-webkit-scrollbar{width:0!important;height:0!important;display:none!important}
        .native-wl-scroll{scrollbar-width:none!important;-ms-overflow-style:none!important}.native-wl-scroll::-webkit-scrollbar{width:0!important;height:0!important;display:none!important}
        .native-summary-row td{height:34px!important;min-height:34px!important;background:#fff!important;color:#676879!important;padding:3px 8px!important;text-align:center!important;vertical-align:middle!important;border-bottom:0!important;font-size:10px!important;font-weight:400!important}
        .native-summary-row td:first-child{background:#fff!important;z-index:3!important}
        .native-summary-number{display:inline-flex;min-width:42px;min-height:27px;flex-direction:column;align-items:center;justify-content:center;line-height:12px;color:#53576a;font-size:11px}
        .native-summary-number small{display:block;font-size:8px;line-height:8px;color:#8a8f9e;font-weight:400}
        .native-summary-bar{height:22px;min-width:88px;width:100%;max-width:112px;margin:0 auto;border:1px solid #d0d4e4;background:#fff;padding:3px;display:flex;gap:1px;align-items:stretch}
        .native-summary-bar i{display:block;height:14px;min-width:3px}
      `;doc.head.appendChild(style);
    }
    doc.querySelectorAll('.group .board-table').forEach(enhanceTable);
  }
  function attach(){
    let shellDoc;
    try{shellDoc=shell.contentDocument}catch(e){return}
    if(!shellDoc)return;
    const inner=shellDoc.getElementById('demo');
    if(!inner)return;
    const run=()=>{
      let doc;try{doc=inner.contentDocument}catch(e){return}
      if(!doc)return;
      enhance(doc);
      const screen=doc.getElementById('screen');
      if(screen&&!screen.dataset.nativeSummaryObserved){
        screen.dataset.nativeSummaryObserved='1';
        new MutationObserver(()=>requestAnimationFrame(()=>enhance(doc))).observe(screen,{childList:true,subtree:true});
      }
    };
    inner.addEventListener('load',run);
    if(inner.contentDocument&&inner.contentDocument.readyState!=='loading')run();
  }
  shell.addEventListener('load',attach);
  if(shell.contentDocument&&shell.contentDocument.readyState!=='loading')attach();
})();
</script>
</body>
</html>
