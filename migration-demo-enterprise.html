<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Enterprise Zoho CRM Engineering & Migration — Demo</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eef2f7}iframe{display:block;width:100%;height:100%;border:0}
</style>
</head>
<body>
<iframe id="migrationApp" src="migration-demo.html?v=20260905-enterprise-flat1" title="Enterprise Zoho CRM migration control center"></iframe>
<script>
(() => {
  const frame=document.getElementById('migrationApp');
  const css=`
    .pipeline{counter-reset:migration-step;display:block!important;border:1px solid #d7dee7!important;border-bottom:0!important;margin-top:8px!important;padding:0!important;overflow:visible!important;background:#fff!important}
    .pipe{counter-increment:migration-step;display:grid!important;grid-template-columns:34px minmax(150px,210px) minmax(0,1fr)!important;gap:14px!important;align-items:start!important;position:relative!important;border:0!important;border-bottom:1px solid #d7dee7!important;border-radius:0!important;box-shadow:none!important;min-height:0!important;padding:12px 14px 12px 12px!important;background:#fff!important}
    .pipe:before{content:counter(migration-step,decimal-leading-zero)!important;position:static!important;display:block!important;min-width:0!important;width:auto!important;height:auto!important;padding:2px 0 0!important;border:0!important;border-radius:0!important;background:none!important;color:#758296!important;font:700 9px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace!important;letter-spacing:.03em!important}
    .pipe:after{content:""!important;position:absolute!important;left:0!important;top:0!important;bottom:0!important;right:auto!important;width:3px!important;height:auto!important;background:#aab5c1!important}
    .pipe.source:after{background:#6683c8!important}.pipe.clean:after{background:#4b9a80!important}.pipe.ai:after{background:#8c6aab!important}.pipe.review:after{background:#b68b36!important}.pipe.target:after{background:#56896f!important}
    .pipe b{display:block!important;margin:0!important;color:#27364a!important;font-size:10px!important;line-height:1.4!important;font-weight:700!important}
    .pipe span{display:block!important;margin:0!important;color:#657487!important;font-size:9px!important;line-height:1.5!important}
    @media(max-width:700px){.pipe{grid-template-columns:30px minmax(0,1fr)!important;gap:8px 12px!important}.pipe span{grid-column:2!important}}
  `;
  function apply(){
    try{
      const doc=frame.contentDocument;
      if(!doc||!doc.head)return;
      let style=doc.getElementById('enterprise-process-register-style');
      if(!style){style=doc.createElement('style');style.id='enterprise-process-register-style';doc.head.appendChild(style)}
      style.textContent=css;
    }catch(e){}
  }
  frame.addEventListener('load',()=>{apply();setTimeout(apply,150);setTimeout(apply,700)});
  setTimeout(apply,300);
})();
</script>
</body>
</html>
