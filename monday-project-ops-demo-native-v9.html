<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Monday.com Project Operations Control Center — DCode</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}#native{display:block;width:100%;height:100%;border:0;background:#fff}</style>
</head>
<body>
<iframe id="native" src="monday-project-ops-demo-native-v8.html?v=20260904-native-table1" title="Interactive Monday.com Project Operations Control Center reconstruction" allowfullscreen></iframe>
<script>
(function(){
  const outer=document.getElementById('native');

  function deepestDoc(){
    try{
      let doc=outer.contentDocument;
      if(!doc)return null;
      for(let i=0;i<18;i++){
        const frame=doc.querySelector('iframe');
        if(!frame||!frame.contentDocument)break;
        doc=frame.contentDocument;
      }
      return doc;
    }catch(e){return null}
  }

  function install(){
    const doc=deepestDoc();
    if(!doc||!doc.getElementById('screen'))return false;

    if(!doc.getElementById('monday-working-table-style')){
      const style=doc.createElement('style');
      style.id='monday-working-table-style';
      style.textContent=`
        .native-working-table-widget{grid-column:1/-1!important;min-height:214px!important;padding:0!important;overflow:hidden!important;border:1px solid #d0d4e4!important;border-radius:8px!important;background:#fff!important;box-shadow:none!important}
        .native-working-table-widget .panel-title,.native-working-table-widget>.monday-dw-head{display:none!important}
        .mwt-head{height:44px;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:0 12px 0 16px;border-bottom:1px solid #d0d4e4;background:#fff;color:#323338}
        .mwt-title{min-width:0;display:flex;align-items:baseline;gap:10px}.mwt-title strong{font-size:14px;font-weight:500;white-space:nowrap}.mwt-title span{font-size:10px;color:#8a8f9e;white-space:nowrap}
        .mwt-tools{display:flex;align-items:center;gap:8px;color:#53576a}.mwt-filter{height:28px;border:1px solid #c3c7d5;border-radius:4px;background:#fff;color:#53576a;padding:0 9px;font:400 11px/1 Arial,sans-serif}.mwt-more{width:28px;height:28px;border:0;background:transparent;color:#53576a;font-size:17px;letter-spacing:1px}
        .mwt-scroll{width:100%;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}.mwt-scroll::-webkit-scrollbar{display:none;width:0;height:0}
        .mwt-table{width:100%;min-width:890px;border-collapse:collapse;table-layout:fixed;background:#fff;color:#323338;font-size:11px}
        .mwt-table th{height:34px;padding:0 12px;text-align:left;background:#f6f7fb;color:#676879;font-weight:500;border-bottom:1px solid #d0d4e4;border-right:1px solid #e6e9ef;white-space:nowrap}
        .mwt-table td{height:45px;padding:0 12px;border-bottom:1px solid #e6e9ef;border-right:1px solid #eef0f4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
        .mwt-table tr:last-child td{border-bottom:0}.mwt-table th:last-child,.mwt-table td:last-child{border-right:0}
        .mwt-table th:nth-child(1),.mwt-table td:nth-child(1){width:29%}.mwt-table th:nth-child(2),.mwt-table td:nth-child(2){width:17%}.mwt-table th:nth-child(3),.mwt-table td:nth-child(3){width:14%}.mwt-table th:nth-child(4),.mwt-table td:nth-child(4){width:19%}.mwt-table th:nth-child(5),.mwt-table td:nth-child(5){width:11%}.mwt-table th:nth-child(6),.mwt-table td:nth-child(6){width:10%}
        .mwt-task{font-weight:500;color:#323338}.mwt-person{display:flex;align-items:center;gap:8px;min-width:0}.mwt-avatar{width:26px;height:26px;min-width:26px;border-radius:50%;display:grid;place-items:center;background:#cce5ff;color:#323338;font-size:9px;font-weight:600}.mwt-person span:last-child{overflow:hidden;text-overflow:ellipsis}
        .mwt-status{display:inline-flex;align-items:center;justify-content:center;min-width:82px;height:25px;border-radius:3px;padding:0 8px;font-size:10px;font-weight:500;background:#fdab3d;color:#323338}.mwt-status.done{background:#00c875;color:#fff}.mwt-status.stuck{background:#e2445c;color:#fff}.mwt-status.review{background:#579bfc;color:#fff}
        .mwt-empty{height:72px;text-align:center!important;color:#8a8f9e!important}
        @media(max-width:720px){.native-working-table-widget{min-height:190px!important}.mwt-title span{display:none}.mwt-table{min-width:760px}.mwt-filter{display:none}}
      `;
      doc.head.appendChild(style);
    }

    if(!doc.getElementById('monday-working-table-script')){
      const script=doc.createElement('script');
      script.id='monday-working-table-script';
      script.textContent=`
        (function(){
          function esc(value){return String(value==null?'':value).replace(/[&<>\"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]})}
          function initials(name){return String(name||'').split(/\\s+/).filter(Boolean).slice(0,2).map(function(x){return x[0]}).join('').toUpperCase()||'—'}
          function statusClass(status){var s=String(status||'').toLowerCase();if(/done|complete/.test(s))return 'done';if(/stuck|blocked/.test(s))return 'stuck';if(/review/.test(s))return 'review';return ''}
          function tracked(value){if(value===0)return '0 h';if(value==null||value==='')return '—';if(typeof value==='number')return value+' h';var text=String(value);return /h|m/.test(text)?text:text+' h'}
          function findWidget(){
            var matches=[].slice.call(document.querySelectorAll('section.card')).filter(function(card){return /Working Now/i.test(card.textContent||'')});
            matches.sort(function(a,b){return (a.textContent||'').length-(b.textContent||'').length});
            return matches[0]||null;
          }
          function apply(){
            var widget=findWidget();if(!widget)return false;
            if(widget.dataset.nativeWorkingTable==='2')return true;
            var source=[];
            try{
              if(typeof tasks!=='undefined'&&Array.isArray(tasks))source=tasks.slice();
            }catch(e){}
            var active=source.filter(function(t){return /working|progress|started/i.test(String(t.status||''))});
            var rows=(active.length?active:source).slice(0,4);
            widget.classList.add('native-working-table-widget');
            widget.dataset.nativeWorkingTable='2';
            widget.innerHTML='<div class="mwt-head"><div class="mwt-title"><strong>Working Now</strong><span>Table widget · active tasks</span></div><div class="mwt-tools"><button class="mwt-filter" type="button">Working on it ▾</button><button class="mwt-more" type="button" aria-label="Widget options">...</button></div></div><div class="mwt-scroll"><table class="mwt-table"><thead><tr><th>Task</th><th>Person</th><th>Status</th><th>Project</th><th>Due date</th><th>Time tracked</th></tr></thead><tbody>'+(rows.length?rows.map(function(t){var personName=t.person||t.owner||'Unassigned';var status=t.status||'Working on it';return '<tr><td class="mwt-task">'+esc(t.item||t.name||t.id||'Task')+'</td><td><div class="mwt-person"><span class="mwt-avatar">'+esc(initials(personName))+'</span><span>'+esc(personName)+'</span></div></td><td><span class="mwt-status '+statusClass(status)+'">'+esc(status)+'</span></td><td>'+esc(t.project||'—')+'</td><td>'+esc(t.deadline||t.due||'—')+'</td><td>'+esc(tracked(t.recorded!=null?t.recorded:t.actual))+'</td></tr>'}).join(''):'<tr><td colspan="6" class="mwt-empty">No active tasks</td></tr>')+'</tbody></table></div>';
            return true;
          }
          window.__applyMondayWorkingTable=apply;
          apply();
          var screen=document.getElementById('screen');
          if(screen&&!screen.dataset.nativeWorkingTableObserved){
            screen.dataset.nativeWorkingTableObserved='1';
            var queued=false;
            new MutationObserver(function(){if(queued)return;queued=true;requestAnimationFrame(function(){queued=false;apply()})}).observe(screen,{childList:true,subtree:true});
          }
        })();
      `;
      doc.body.appendChild(script);
    }else{
      try{doc.defaultView.__applyMondayWorkingTable&&doc.defaultView.__applyMondayWorkingTable()}catch(e){}
    }
    return true;
  }

  function start(){
    let tries=0;
    const timer=setInterval(function(){tries++;install();if(tries>300)clearInterval(timer)},100);
  }
  outer.addEventListener('load',start);
  start();
})();
</script>
</body>
</html>
