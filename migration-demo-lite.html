<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zoho Migration Control Center</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Arial,sans-serif;color:#1f2d3d;background:#f3f6fa}button{font:inherit}.app{height:100vh;display:grid;grid-template-rows:54px 1fr;overflow:hidden}.top{background:#28445f;color:#fff;display:grid;grid-template-columns:260px 1fr 180px;align-items:center;padding:0 18px}.brand{font-weight:700;font-size:13px}.tabs{height:100%;display:flex;justify-content:center}.tabs button{border:0;background:transparent;color:#dbe7f2;padding:0 11px;font-size:10px;cursor:pointer}.tabs button.active{color:#fff;border-bottom:2px solid #fff}.ws{text-align:right;font-size:9px;font-weight:700}.body{display:grid;grid-template-columns:210px 1fr;min-height:0}.side{background:#fff;border-right:1px solid #dbe3ec;padding:16px 12px}.side h4{font-size:9px;color:#7e8da1;letter-spacing:.08em;margin:0 8px 12px}.side button{width:100%;border:0;background:transparent;text-align:left;padding:10px;font-size:11px;color:#4e6077;cursor:pointer}.side button.active{background:#eaf0ff;color:#315fd7;font-weight:700}.main{padding:18px;overflow:auto}.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.eyebrow{font-size:8px;color:#7d8999;text-transform:uppercase;letter-spacing:.08em}.bar h1{margin:4px 0 0;font-size:23px}.btn{border:1px solid #d3dae4;background:#fff;padding:9px 12px;font-size:10px;font-weight:700;cursor:pointer}.primary{background:#3561df;color:#fff;border-color:#3561df}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card,.panel{background:#fff;border:1px solid #dce3eb}.card{padding:17px}.card b{display:block;font-size:26px}.card span{font-size:9px;color:#78879a}.panel{padding:17px;margin-bottom:12px}.panel h3{margin:0 0 12px;font-size:14px}.muted{font-size:10px;color:#68778a;line-height:1.55}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #e7ebf0;text-align:left;font-size:10px;vertical-align:top}th{background:#f7f9fc;color:#65758a}.pill{display:inline-block;padding:4px 7px;font-size:9px;font-weight:700;background:#e8f7ef;color:#197450}.pill.partial{background:#fff4d8;color:#8a6100}.pill.na{background:#eef1f5;color:#5b6878}.notice{margin-top:12px;padding:11px;background:#f7f9fc;border:1px solid #e2e7ed;font-size:9px;color:#667487}.map{display:grid;grid-template-columns:1fr 30px 1.3fr;gap:8px;align-items:center}.map div{border:1px solid #e1e6ed;background:#fff;padding:10px;font-size:10px}.map .a{border:0;background:transparent;text-align:center}.timeline{display:grid;gap:10px}.event{border-left:2px solid #d8e0eb;padding-left:10px;font-size:10px}.code{background:#111923;color:#dce7f3;padding:16px;white-space:pre-wrap;font:10px/1.6 monospace}@media(max-width:900px){.body{grid-template-columns:1fr}.side{display:none}.tabs{display:none}.top{grid-template-columns:1fr}.ws{display:none}.grid{grid-template-columns:repeat(2,1fr)}.map{grid-template-columns:1fr}.map .a{display:none}}
</style></head><body><div class="app"><header class="top"><div class="brand">Zoho Migration Control Center</div><nav class="tabs" id="tabs"></nav><div class="ws">DEMO WORKSPACE</div></header><div class="body"><aside class="side"><h4>MIGRATION</h4><div id="side"></div></aside><main class="main"><div class="bar"><div><div class="eyebrow">Migration operations</div><h1 id="title"></h1></div><div id="actions"></div></div><div id="page"></div></main></div></div><script>
const pages=['Migration Overview','Field Mapping','Import Batches','Deluge Functions','API Usage','Reconciliation','Compliance Report'];const tabs=['Overview','Mappings','Batches','Functions','Reconciliation','Compliance'];const route={Overview:pages[0],Mappings:pages[1],Batches:pages[2],Functions:pages[3],Reconciliation:pages[5],Compliance:pages[6]};let current=pages[0];
const controls=[['DH-01','Personal Data Inventory','PASS','Candidate identity, contact, address, resume and qualification fields identified.'],['DH-02','Data Minimization','PASS','Only recruitment and migration-required fields are processed.'],['DH-03','Purpose Limitation','PASS','Processing scope is limited to recruitment migration and reconciliation.'],['DH-04','Access & Least Privilege','PARTIAL','Production IAM evidence requires owner validation.'],['DH-05','Credential Protection','PASS','OAuth/API secrets excluded from migration records and report output.'],['DH-06','Transport Security','PASS','API calls use HTTPS/TLS protected endpoints.'],['DH-07','Migration Reconciliation','PASS','Every source row receives a migrated, duplicate or exception disposition.'],['DH-08','Data Accuracy & Confidence','PASS','Confidence scoring gates uncertain parsed fields for review.'],['DH-09','PII-safe Logging','PARTIAL','Production log sampling remains an evidence item.'],['DH-10','Retention & Deletion','NOT ASSESSED','Retention schedule requires data-owner/legal configuration.'],['DH-11','Auditability','PASS','Batch, API, exception and reconciliation events are traceable.'],['DH-12','Recovery & Reliability','PASS','Controlled batches, retries and reconciliation support recovery.'],['DH-13','Third-party Processing','PARTIAL','Zoho, Google Drive and ATS processors identified; contracts are external.'],['DH-14','Data Subject Rights','PASS','Records remain addressable for access, correction and deletion workflows.']];
const t=document.getElementById('tabs'),s=document.getElementById('side'),p=document.getElementById('page'),h=document.getElementById('title'),a=document.getElementById('actions');function tab(){return current===pages[0]?'Overview':current===pages[1]?'Mappings':current===pages[2]?'Batches':current===pages[3]?'Functions':current===pages[6]?'Compliance':'Reconciliation'}function nav(){t.innerHTML=tabs.map(x=>`<button class="${tab()===x?'active':''}" data-x="${x}">${x}</button>`).join('');s.innerHTML=pages.map(x=>`<button class="${current===x?'active':''}" data-p="${x}">${x}</button>`).join('');t.querySelectorAll('button').forEach(b=>b.onclick=()=>{current=route[b.dataset.x];render()});s.querySelectorAll('button').forEach(b=>b.onclick=()=>{current=b.dataset.p;render()})}
function report(){let pass=controls.filter(x=>x[2]==='PASS').length,partial=controls.filter(x=>x[2]==='PARTIAL').length,na=controls.filter(x=>x[2]==='NOT ASSESSED').length;return `<section class="grid"><div class="card"><b>${controls.length}</b><span>controls assessed</span></div><div class="card"><b>${pass}</b><span>pass</span></div><div class="card"><b>${partial}</b><span>partial</span></div><div class="card"><b>${na}</b><span>not assessed</span></div></section><section class="panel" style="margin-top:12px"><h3>Data Handling & Compliance Assessment</h3><p class="muted">Candidate PII · 59K+ JazzHR source scope · 120K+ overall migration program · Framework alignment: Philippines DPA, GDPR principles, SOC 2 control concepts, API security.</p><table><thead><tr><th>Control</th><th>Area</th><th>Status</th><th>Evidence / assessment</th></tr></thead><tbody>${controls.map(x=>`<tr><td><b>${x[0]}</b></td><td>${x[1]}</td><td><span class="pill ${x[2]==='PARTIAL'?'partial':x[2]==='NOT ASSESSED'?'na':''}">${x[2]}</span></td><td>${x[3]}</td></tr>`).join('')}</tbody></table><div class="notice"><b>Assessment boundary:</b> This demo documents technical and operational controls and is not a legal certification of GDPR, Philippine Data Privacy Act, SOC 2, or any other regulation.</div></section>`}
function download(){let d=new Date().toISOString().slice(0,10),text=`DATA HANDLING & COMPLIANCE ASSESSMENT\nEnterprise Zoho CRM Engineering & Migration\nGenerated: ${d}\n\n`+controls.map(x=>`${x[0]} | ${x[1]} | ${x[2]}\nEvidence: ${x[3]}`).join('\n\n')+`\n\nDISCLAIMER\nThis report documents assessed technical and operational controls and is not a legal certification.`;let u=URL.createObjectURL(new Blob([text],{type:'text/plain'})),l=document.createElement('a');l.href=u;l.download=`zoho-migration-compliance-${d}.txt`;l.click();URL.revokeObjectURL(u)}
function render(){nav();h.textContent=current;a.innerHTML='';if(current===pages[0])p.innerHTML=`<section class="grid"><div class="card"><b>120,000+</b><span>overall source program</span></div><div class="card"><b>59,000+</b><span>JazzHR scope</span></div><div class="card"><b>62,000+</b><span>Apploi scope</span></div><div class="card"><b>99.1%</b><span>demo reconciliation rate</span></div></section>`;if(current===pages[1])p.innerHTML=`<section class="panel"><h3>Resume migration field map</h3><div class="map"><div>resume_filename</div><div class="a">→</div><div>Source Resume Filename</div><div>gdrive_link</div><div class="a">→</div><div>Resume File Link</div><div>facility-applied</div><div class="a">→</div><div>Facility Lookup</div><div>confidence</div><div class="a">→</div><div>Migration Confidence / review gate</div></div></section>`;if(current===pages[2]){a.innerHTML='<button class="btn" id="run">Run synthetic batch</button>';p.innerHTML=`<section class="panel"><h3>Batch Progress</h3><div class="timeline"><div class="event">JHR-027 · 88% complete</div><div class="event">APP-014 · 62% complete</div></div></section>`;document.getElementById('run').onclick=()=>p.innerHTML=`<section class="panel"><h3>Synthetic batch JHR-028</h3><div class="timeline"><div class="event">Manifest verified</div><div class="event">37 confidence exceptions flagged</div><div class="event">121 duplicates identified</div><div class="event">Every source row received a disposition</div></div></section>`}if(current===pages[3])p.innerHTML=`<section class="panel"><h3>automation.FillRecruitmentLogs1</h3><pre class="code">validate record ID\nfetch live Lead\npreserve subform rows\nappend stage log\nupdate with triggers suppressed\nrefetch + verify row count</pre></section>`;if(current===pages[4])p.innerHTML=`<section class="panel"><h3>API Operations</h3><div class="timeline"><div class="event">Get Record by ID · 200</div><div class="event">Search Records · 200</div><div class="event">Update Record · 200</div></div></section>`;if(current===pages[5])p.innerHTML=`<section class="panel"><h3>Migration reconciliation</h3><table><tr><th>Disposition</th><th>Count</th><th>Rule</th></tr><tr><td><span class="pill">Migrated</span></td><td>4,812</td><td>Accepted + verified</td></tr><tr><td>Duplicate</td><td>143</td><td>Email / mobile / resume filename</td></tr><tr><td>Exception</td><td>45</td><td>Low confidence, missing facility, or license review</td></tr></table></section>`;if(current===pages[6]){a.innerHTML='<button class="btn primary" id="gen">Generate compliance report</button>';p.innerHTML=`<section class="panel"><h3>Compliance report generator</h3><p class="muted">Generate an evidence-based control assessment covering privacy, data handling, migration integrity, access, API security, auditability, retention and operational resilience.</p><div class="notice">Statuses are PASS, PARTIAL and NOT ASSESSED rather than a claim of formal certification.</div></section>`;document.getElementById('gen').onclick=()=>{p.innerHTML=report();a.innerHTML='<button class="btn" id="dl">Download report</button>';document.getElementById('dl').onclick=download}}}render();
</script></body></html>
