function renderRelationshipMap(model){
  const positions=[[36,48],[414,48],[792,48],[36,326],[414,326],[792,326],[36,604],[414,604],[792,604],[36,882],[414,882],[792,882],[36,1160],[414,1160],[792,1160]];
  const canvasHeight=model.entities.length>12?1460:model.entities.length>9?1180:model.entities.length>6?900:620;
  const entities=model.entities.map((entity,index)=>{
    const [x,y]=positions[index];
    return `<article class="erd-entity" data-entity="${index}" style="left:${x}px;top:${y}px"><header><div><strong>${entity.name}</strong><span>${entity.type}</span></div><i>${String(index+1).padStart(2,'0')}</i></header><div class="erd-fields">${entity.fields.map(field=>`<div><b class="${field[0]?field[0].toLowerCase():''}">${field[0]||'•'}</b><span>${field[1]}</span></div>`).join('')}</div></article>`;
  }).join('');
  return `<div class="erd-shell"><div class="erd-toolbar"><div><span>System data map</span><strong>${p.title}</strong></div><div class="erd-legend"><span><i class="relation"></i>relation</span><span><i class="sync"></i>sync / automation</span><span><i class="ai"></i>AI-assisted</span></div></div><div class="erd-scroll"><div class="erd-canvas" style="height:${canvasHeight}px" data-relations='${JSON.stringify(model.relations)}'><svg class="erd-lines" viewBox="0 0 1080 ${canvasHeight}" aria-hidden="true"><defs><marker id="erdArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z"/></marker></defs></svg>${entities}</div></div><div class="erd-caption"><p>${model.summary}</p><span>Conceptual data architecture · field names simplified for portfolio clarity</span></div></div>`;
}

function drawRelationshipLines(){
  const canvas=document.querySelector('.erd-canvas'),svg=canvas?.querySelector('.erd-lines');if(!canvas||!svg)return;
  svg.querySelectorAll('.erd-edge').forEach(edge=>edge.remove());
  const canvasRect=canvas.getBoundingClientRect(),relations=JSON.parse(canvas.dataset.relations||'[]');
  relations.forEach(([from,to,label],index)=>{
    const a=canvas.querySelector(`[data-entity="${from}"]`).getBoundingClientRect(),b=canvas.querySelector(`[data-entity="${to}"]`).getBoundingClientRect();
    const ax=a.left-canvasRect.left+a.width/2,ay=a.top-canvasRect.top+a.height/2,bx=b.left-canvasRect.left+b.width/2,by=b.top-canvasRect.top+b.height/2;
    const horizontal=Math.abs(bx-ax)>=Math.abs(by-ay),sx=horizontal?(bx>ax?a.right-canvasRect.left:a.left-canvasRect.left):ax,sy=horizontal?ay:(by>ay?a.bottom-canvasRect.top:a.top-canvasRect.top),ex=horizontal?(bx>ax?b.left-canvasRect.left:b.right-canvasRect.left):bx,ey=horizontal?by:(by>ay?b.top-canvasRect.top:b.bottom-canvasRect.top),mid=horizontal?(sx+ex)/2:(sy+ey)/2;
    const path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('class',`erd-edge ${/(sync|queue|track|execute|trigger|create|write|evaluate|send)/i.test(label)?'sync-edge':''} ${/AI/i.test(label)?'ai-edge':''}`);path.setAttribute('d',horizontal?`M${sx} ${sy} H${mid} V${ey} H${ex}`:`M${sx} ${sy} V${mid} H${ex} V${ey}`);path.setAttribute('marker-end','url(#erdArrow)');
    const text=document.createElementNS('http://www.w3.org/2000/svg','text');text.setAttribute('class','erd-edge-label');text.setAttribute('x',horizontal?mid+5:sx+5);text.setAttribute('y',horizontal?(sy+ey)/2-5:mid-5);text.textContent=label;svg.append(path,text);
  });
}
requestAnimationFrame(drawRelationshipLines);window.addEventListener('resize',drawRelationshipLines);
const CASE_W=1600,CASE_H=900;
function fitCasePreview(){const f=document.querySelector('.case-live-preview'),d=document.querySelector('.case-laptop-display');if(!f||!d)return;const apply=()=>{const sc=Math.min(d.clientWidth/CASE_W,d.clientHeight/CASE_H);f.style.width=CASE_W+'px';f.style.height=CASE_H+'px';f.style.transform=`scale(${sc})`;f.style.left=Math.max(0,(d.clientWidth-CASE_W*sc)/2)+'px';f.style.top=Math.max(0,(d.clientHeight-CASE_H*sc)/2)+'px'};new ResizeObserver(apply).observe(d);f.addEventListener('load',apply);apply()};fitCasePreview();
