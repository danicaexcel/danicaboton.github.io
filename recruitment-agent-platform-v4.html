function dashboardHtml(){return `<div class="dash-top"><div><h1>Agent Operations</h1><p>Cost, token, activity and execution monitoring for the recruitment agent runtime.</p></div><select id="dashRange" class="timeframe-select"><option value="7d">7 days</option><option value="30d" selected>30 days</option><option value="90d">90 days</option><option value="all">All time</option></select></div>

<div class="dash-card"><div class="dash-card-head"><div><h3>Overview</h3><p id="dashPeriodLabel">30-day operating snapshot</p></div></div><div class="overview-strip"><div class="overview-metric"><div class="metric-icon">▶</div><span>Runs</span><strong id="ovRuns">184</strong><small>scheduled + requested</small></div><div class="overview-metric"><div class="metric-icon">T</div><span>Tokens</span><strong id="ovTokens">10.9M</strong><small>input + output</small></div><div class="overview-metric"><div class="metric-icon">$</div><span>Period cost</span><strong id="ovCost">$11.84</strong><small>model API estimate</small></div><div class="overview-metric"><div class="metric-icon">✓</div><span>Success rate</span><strong id="ovSuccess">96.8%</strong><small>tool + model runs</small></div><div class="overview-metric"><div class="metric-icon">↑</div><span>Advanced runs</span><strong id="ovAdvanced">2</strong><small>approval-only escalation</small></div></div></div>
<div class="dash-grid"><div class="dash-card"><div class="dash-card-head"><div><h3>Runtime mix</h3><p>How the low-cost routing layer is being used.</p></div></div><div class="usage-body"><div class="ring-row"><div class="ring-stat"><div class="ring" style="--pct:70%"><b>70%</b></div><span>nano share</span><small>routing / validation</small></div><div class="ring-stat"><div class="ring" style="--pct:30%"><b>30%</b></div><span>mini share</span><small>specialist analysis</small></div><div class="ring-stat"><div class="ring" style="--pct:2%"><b id="advancedRing">2</b></div><span>advanced runs</span><small>explicit approval only</small></div></div><div class="mini-legend"><span><i></i>specialist / exception</span><span><i class="dark"></i>routine runtime</span></div></div></div>
<div class="dash-card"><div class="dash-card-head"><div><h3>Model consumption</h3><p id="modelPeriod">30-day token volume</p></div></div><div class="model-body"><div class="model-row"><b>GPT-4.1 nano</b><div class="model-bar"><span style="width:100%"></span></div><small id="mNano">7.6M</small></div><div class="model-row"><b>GPT-4.1 mini</b><div class="model-bar"><span class="peach" style="width:44%"></span></div><small id="mMini">3.3M</small></div><div class="model-row"><b>Advanced model</b><div class="model-bar"><span class="peach" style="width:3%"></span></div><small id="mAdv">0.12M</small></div><div class="model-note">Advanced models are not part of normal schedules. They require an exception condition plus explicit user approval.</div></div></div></div>
<div class="dash-grid bottom"><div class="dash-card"><div class="dash-card-head"><div><h3>Cost by agent</h3><p id="agentCostPeriod">30-day estimated model API cost</p></div></div><div class="agent-cost" id="agentCostRows"></div></div><div class="dash-card"><div class="dash-card-head"><div><h3>Execution health</h3><p>Recent run outcomes by day — synthetic telemetry.</p></div></div><div class="health-body"><div class="health-grid">${['good','good','good','warm','good','good','good','good','soft','good','good','good','good','good','good','good','good','good','warm','good','good'].map((c,i)=>`<div class="health-cell ${c}">${i%5===0?'✓':''}</div>`).join('')}</div><div class="health-labels"><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span></div><div class="health-summary"><div><span>Successful</span><b>96.8%</b></div><div><span>Approval waits</span><b>3</b></div><div><span>Failed / retry</span><b>1</b></div></div></div></div></div>

function renderAgentCosts(doc,d){const box=doc.getElementById('agentCostRows');if(!box)return;const names=['Manager Assistant','Operations','Rediscovery','Job Posting'];const max=Math.max(...d.cost);box.innerHTML=d.cost.map((v,i)=>`<div class="cost-row"><b>${names[i]}</b><div class="cost-track"><span class="${i===1?'peach':''}" style="width:${Math.max(8,v/max*100)}%"></span></div><small>$${v.toFixed(2)}</small></div>`).join('')}
function applyRange(doc,key){activeRange=key;const d=ranges[key]||ranges['30d'];const set=(id,v)=>{const e=doc.getElementById(id);if(e)e.textContent=v};set('ovRuns',d.runs);set('ovTokens',d.tokens);set('ovCost',d.periodCost);set('ovSuccess',d.success);set('ovAdvanced',d.advanced);set('advancedRing',d.advanced);set('mNano',d.model[0]);set('mMini',d.model[1]);set('mAdv',d.model[2]);set('dashPeriodLabel',d.label+' operating snapshot');set('modelPeriod',d.label+' token volume');set('agentCostPeriod',d.label+' estimated model API cost');renderAgentCosts(doc,d);['dashRange','costRange'].forEach(id=>{const s=doc.getElementById(id);if(s&&s.value!==key)s.value=key})}
function patchUsage(doc){const heads=[...doc.querySelectorAll('.panel-head h3')];const costTitle=heads.find(h=>h.textContent.trim().startsWith('Cost by agent'));if(costTitle&&!doc.getElementById('costRange')){const s=rangeSelect(doc,'costRange');const head=costTitle.closest('.panel-head');const spacer=doc.createElement('span');spacer.className='spacer';head.appendChild(spacer);head.appendChild(s);s.addEventListener('change',()=>applyRange(doc,s.value))}
const usage=doc.querySelector('[data-page="usage"] .page-wrap');if(usage&&!doc.getElementById('advancedEscalationCard')){const c=doc.createElement('div');c.id='advancedEscalationCard';c.className='escalation-card';c.innerHTML='<div class="ec-head"><div><h3>Advanced-model escalation</h3><p>Default path remains GPT-4.1 nano + GPT-4.1 mini. Stronger models are exception-only.</p></div><span class="ec-badge">Explicit approval</span></div><div class="ec-body"><div class="escalation-rule"><b>When proposed</b><span>Mini fails validation after the allowed retry, evidence materially conflicts, or the request requires unusually deep multi-document / multi-system synthesis.</span></div><div class="escalation-rule"><b>How it starts</b><span>n8n returns an escalation recommendation with the reason and estimated added cost. The user must explicitly approve the advanced run.</span></div><div class="escalation-rule"><b>Runtime limit</b><span>One advanced-model call, compact context only, no autonomous loop. The same main agent validates and presents the result.</span></div><div class="escalation-rule"><b>Never used for</b><span>Routine summaries, candidate search, job-post drafts, normal scoring support, scheduled reports, reminders, file creation, or final hiring / rejection decisions.</span></div></div>';usage.appendChild(c)}
const rows=[...doc.querySelectorAll('[data-page="usage"] .metric-row')];const e=rows.find(r=>r.textContent.includes('Escalation'));if(e){const strong=e.querySelector('strong');if(strong)strong.textContent='Approval required'}}
function patch(){const doc=frame.contentDocument;if(!doc||!doc.body)return;injectStyles(doc);const dash=doc.querySelector('[data-page="dashboard"] .page-wrap');if(dash&&!doc.getElementById('dashRange')){dash.innerHTML=dashboardHtml();doc.getElementById('dashRange').addEventListener('change',e=>applyRange(doc,e.target.value));applyRange(doc,activeRange)}patchUsage(doc);const back=doc.querySelector('.back');if(back)back.target='_top'}
frame.addEventListener('load',()=>{patch();setTimeout(patch,300);setTimeout(patch,900)});
})();
